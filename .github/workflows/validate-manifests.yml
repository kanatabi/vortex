name: validate-manifests
# Every PR and every push gets the anvil truth battery: builds, the kind-count
# table, config-shape + PreSync assertions, and the RENDERED diff summary.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    # The check-run NAME is the contract with anvil's auto-merge guard (it
    # polls for `validate-manifests`). Renaming this job or this workflow
    # silently strands every bump PR — do it only together with the guard.
    name: validate-manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: anvil validate-manifests
        uses: kanatabi/anvil/actions/validate-manifests@728231b0a8c10eab8739e75a4c5394c8f2b6386c # v6 env-model
        with:
          base-ref: ${{ github.event.pull_request.base.sha || 'origin/main' }}
