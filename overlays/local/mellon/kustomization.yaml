# Local-cluster view of mellon: dev Bao paths (overlays/dev/mellon) + single-node
# placement + self-signed TLS. The chain shows the axis separation: env lives
# in overlays/{dev,staging,production}, cluster SHAPE in components/.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../dev/mellon

components:
  - ../../../components/single-node
  - ../../../components/selfsigned
