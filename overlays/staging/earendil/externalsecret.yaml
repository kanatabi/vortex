# Staging twin of earendil's config feed. ORIGIN dropped 2026-11-10 (no consumer —
# see overlays/production/earendil header; the staging HOST is patched in
# kustomization.yaml on the Ingress, which is where it actually matters).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frontend-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bao
    kind: ClusterSecretStore
  target:
    name: app-config
    type: ConfigMap       # MATERIALIZE-AS CONFIGMAP is spec.target.type — nesting it
    #                     # under template was silently ignored (live walk 2026-11-10
    #                     # created a weird Secret-of-type-ConfigMap instead)
    template:
      data:
        PORT: "3000"
        PUBLIC_API_BASE: "/"
        API_BASE: "{{ .API_BASE }}"    # -> http://lumen-http-server.lumen.svc.cluster.local (shared BE) or lumen-staging
  data:
    - secretKey: API_BASE
      remoteRef: { key: earendil/staging, property: API_BASE }
