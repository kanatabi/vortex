apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frontend-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bao
    kind: ClusterSecretStore
  target:
    name: app-config
    template:
      type: ConfigMap
      data:
        PORT: "3000"
        PUBLIC_API_BASE: "/"
        ORIGIN: "{{ .ORIGIN }}"        # -> https://staging.ainurrofiq.com
        API_BASE: "{{ .API_BASE }}"    # -> http://lumen-http-server.lumen.svc.cluster.local (shared BE) or lumen-staging
  data:
    - secretKey: ORIGIN
      remoteRef: { key: earendil/staging, property: ORIGIN }
    - secretKey: API_BASE
      remoteRef: { key: earendil/staging, property: API_BASE }
