# Staging twin of earendil's config feed. ORIGIN dropped 2026-11-10 (no consumer —
# see overlays/production/earendil header; the staging HOST is patched in
# kustomization.yaml on the Ingress, which is where it actually matters).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frontend-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bao
    kind: ClusterSecretStore
  target:
    name: app-config
    manifest:                     # ESO 2.x GENERIC TARGET: create this resource kind
      apiVersion: v1              # instead of a Secret. There is NO spec.target.type
      kind: ConfigMap             # in the 2.15 CRD (schema: creationPolicy|deletionPolicy|
    #                              # immutable|manifest|name|template) — a `type:` field is
    #                              # silently PRUNED by the apiserver. Learned twice on the
    #                              # live walk 2026-11-10: template.type (a no-op) and then
    #                              # target.type (pruned) before the CRD said the truth.

    template:
      data:
        PORT: "3000"
        PUBLIC_API_BASE: "/"
        API_BASE: "{{ .API_BASE }}"    # -> http://lumen-http-server.lumen.svc.cluster.local (shared BE) or lumen-staging
  data:
    - secretKey: API_BASE
      remoteRef: { key: earendil/staging, property: API_BASE }
