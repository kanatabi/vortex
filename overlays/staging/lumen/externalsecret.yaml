# NOTE: ESO creates the Secret with the literal target.name below; kustomize does not
# suffix CRD-internal names, and the deployments' envFrom secretRef also stays literal
# (no tracked Secret resource in this build) — so the wiring matches by construction.
# Key set is 1:1 with the app's env contract (see overlays/production/lumen header for
# the doctrine + the deferred LUMEN_MEDIA_*/LUMEN_BAO_* families).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bao
    kind: ClusterSecretStore
  target:
    name: lumen-secrets
  data:
    - secretKey: LUMEN_DB_URL            # -> .../lumen-pg.db.svc/lumen_staging, db_user_staging creds
      remoteRef: { key: lumen/staging, property: LUMEN_DB_URL }
    - secretKey: LUMEN_MEILI_URL
      remoteRef: { key: lumen/staging, property: LUMEN_MEILI_URL }
    - secretKey: LUMEN_MEILI_KEY
      remoteRef: { key: lumen/staging, property: LUMEN_MEILI_KEY }
    - secretKey: LUMEN_SESSION_JWT_SECRET
      remoteRef: { key: lumen/staging, property: LUMEN_SESSION_JWT_SECRET }
