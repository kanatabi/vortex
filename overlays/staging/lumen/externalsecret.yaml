# NOTE: ESO creates the Secret with the literal target.name below; kustomize does not
# suffix CRD-internal names, and the deployments' envFrom secretRef also stays literal
# (no tracked Secret resource in this build) — so the wiring matches by construction.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bao
    kind: ClusterSecretStore
  target:
    name: lumen-secrets
  data:
    - secretKey: DATABASE_URL        # -> .../lumen-pg-postgres.db.svc/lumen_staging, db_user_staging creds
      remoteRef: { key: lumen/staging, property: DATABASE_URL }
    - secretKey: MEILI_MASTER_KEY
      remoteRef: { key: lumen/staging, property: MEILI_MASTER_KEY }
    - secretKey: MEILI_HOST
      remoteRef: { key: lumen/staging, property: MEILI_HOST }
