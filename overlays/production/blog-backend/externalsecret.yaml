# Backend secret material — rendered as a real K8s Secret by ESO (default target type).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secrets
  namespace: blog-backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bao
    kind: ClusterSecretStore
  target:
    name: blog-backend-secrets     # matches the base Deployment's envFrom secretRef
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: prod/blog-backend, property: DATABASE_URL }
    - secretKey: MEILI_MASTER_KEY
      remoteRef: { key: prod/blog-backend, property: MEILI_MASTER_KEY }
    - secretKey: MEILI_HOST
      remoteRef: { key: prod/blog-backend, property: MEILI_HOST }
