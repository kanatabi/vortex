# Production view of the portal config; Bao path kv/data/mellon/production.
# API_BASE value = whatever the cluster names the lumen service — a VALUE, so
# it lives in Bao (seeded per runbook), never in Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portal-config
  namespace: mellon
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bao
    kind: ClusterSecretStore
  target:
    name: app-config
    manifest:                     # ESO 2.x GENERIC TARGET: create this resource kind
      apiVersion: v1              # instead of a Secret. There is NO spec.target.type
      kind: ConfigMap             # in the 2.15 CRD (schema: creationPolicy|deletionPolicy|
    #                              # immutable|manifest|name|template) — a `type:` field is
    #                              # silently PRUNED by the apiserver. Learned twice on the
    #                              # live walk 2026-11-10: template.type (a no-op) and then
    #                              # target.type (pruned) before the CRD said the truth.

    template:
      data:
        PORT: "3000"
        PROTOCOL_HEADER: "x-forwarded-proto"   # adapter-node: trust the EDGE's forwarded
        HOST_HEADER: "x-forwarded-host"        # headers for origin derivation. Without
        #                     # these the adapter assumes https://host —
        #                     # and Kit's CSRF check then rejects every HTTP form POST
        #                     # (live walk 2026-11-10: portal login 403'd through ANY
        #                     #  path because the pod thought its self-origin was https).
        # NO PORT_HEADER: every real edge is implicit 80/443 (URL normalisation drops
        # them) — trusting x-forwarded-port BREAKS the local NodePort rehearsal
        # (Traefik reports its entrypoint 80 while the browser lives on :30080 ->
        # malformed self-origin -> 400). Verified: without it, both port shapes 401.
        API_BASE: "{{ .API_BASE }}"
  data:
    - secretKey: API_BASE
      remoteRef: { key: mellon/production, property: API_BASE }
