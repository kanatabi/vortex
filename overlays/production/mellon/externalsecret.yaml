# Production view of the portal config; Bao path kv/data/mellon/production.
# API_BASE value = whatever the cluster names the lumen service — a VALUE, so
# it lives in Bao (seeded per runbook), never in Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portal-config
  namespace: mellon
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bao
    kind: ClusterSecretStore
  target:
    name: app-config
    type: ConfigMap       # MATERIALIZE-AS CONFIGMAP is spec.target.type — nesting it
    #                     # under template was silently ignored (live walk 2026-11-10
    #                     # created a weird Secret-of-type-ConfigMap instead)
    template:
      data:
        PORT: "3000"
        API_BASE: "{{ .API_BASE }}"
  data:
    - secretKey: API_BASE
      remoteRef: { key: mellon/production, property: API_BASE }
