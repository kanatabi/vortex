# Production view of mellon: base manifests + the ESO render chain at
# kv/mellon/production. Same envFrom-swap shape as earendil/lumen (one doctrine,
# every app). Portal has no staging twin yet — driftcheck treats one-env
# presence as bootstrap reality, not drift.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../applications/mellon
  - externalsecret.yaml

patches:
  - target:
      kind: Deployment
      name: mellon-web-server
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/env
      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value:
          - configMapRef: { name: app-config }
