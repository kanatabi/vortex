# Production view of mellon: base manifests + the ESO render chain at
# kv/mellon/production. Same envFrom-swap shape as earendil/lumen (one doctrine,
# every app). Portal has no staging twin yet — driftcheck treats one-env
# presence as bootstrap reality, not drift.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../applications/mellon
  - externalsecret.yaml

# Single-node VPS shape (owner decision 2026-11-10). No selfsigned — real TLS
# via the certificates app (console.gofar.id is surface #2, TLS is mandatory).
components:
  - ../../../components/single-node
  - ../../../components/config-gate

# The config-gate Job (rendered by the component into THIS namespace) runs the
# lumen binary — same image/tag the backend itself ships, deliberately. The
# name below must match the component's container image exactly (`lumen`).
# LOCKSTEP: bump tooling edits ghcr.io/kanatabi/lumen newTag HERE, in
# overlays/production/lumen, and overlays/production/earendil in ONE commit —
# a gate decoder older than the app's config epoch is how drift starts.
images:
  - name: lumen
    newName: ghcr.io/kanatabi/lumen
    newTag: v2.0.0

# TLS ownership -> the certificates app (see overlays/production/earendil for
# the full story, incl. WHY these are JSON6902 ops): explicit Certificate
# renders tls-console; the shadow-issuing ingress-shim annotation comes off.
patches:
  - target:
      kind: Ingress
      name: mellon-web-server
    patch: |-
      - op: remove
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
      - op: replace
        path: /spec/tls
        value:
          - secretName: tls-console
            hosts:
              - console.gofar.id

# THE EPOCH PAIR — the annotation value and the gate's --declared arg below
# must stay byte-equal ("0" today); the bump flow edits BOTH lines in one
# commit (CI asserts the equality). One Deployment here -> both targets hit it.
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: unused
      spec:
        template:
          metadata:
            annotations:
              # Strategic merge: creates the annotations map (the base portal
              # pod has none) and leaves everything else intact.
              omicron/config.epoch: "0"
  - target:
      kind: Job
      name: config-gate
    patch: |-
      # Full-args replacement (never element-wise) — see component header.
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: ["config", "check-epoch", "--app", "mellon", "--env", "production", "--declared", "0"]
