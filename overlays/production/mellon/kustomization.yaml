# Production view of mellon: base manifests + the ESO render chain at
# kv/mellon/production. Same envFrom-swap shape as earendil/lumen (one doctrine,
# every app). Portal has no staging twin yet — driftcheck treats one-env
# presence as bootstrap reality, not drift.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../applications/mellon
  - externalsecret.yaml
