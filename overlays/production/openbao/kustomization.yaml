# Production (single VPS) view of openbao: the same ESO-free base every env
# shares — platform services are configured identically at every size — collapsed
# onto one node by the shape component. No selfsigned: real TLS arrives via the
# certificates app, and Bao is cluster-internal anyway (§2: never a public face).
# The manual init/unseal/AppRole bootstrap exception is documented in the base
# (applications/openbao/openbao.yaml header) and applies here unchanged.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../applications/openbao

components:
  - ../../../components/single-node
