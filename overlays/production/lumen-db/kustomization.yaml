# Production (single VPS) view of lumen-db: the ESO-free base (Zalando
# V1Postgresql CR) + placement collapse — numberOfInstances 2->1 via the
# component. The operator itself stays a MANUAL prereq (pinned apply, runbook);
# this chain only ships the cluster CR. Staging/prod databases keep living in
# this one shared cluster — the per-env split is the LUMEN_DB_URL behind each
# overlay's Bao path (INFRA §5).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../applications/lumen-db

components:
  - ../../../components/single-node
