# Values template for earendil — keys live in OpenBao at kv/data/earendil/production.
# Omit `version:` = always latest (drift-pulled every refreshInterval). Pin per config
# release (promotion flow, §5.4) by adding  remoteRef: { ..., version: "N" }  in a PR.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frontend-config
  namespace: earendil
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bao
    kind: ClusterSecretStore
  target:
    name: app-config            # consumed by the Deployment's envFrom (see kustomization patch)
    template:
      type: ConfigMap           # non-sensitive config renders as ConfigMap, not Secret (§5.1)
      data:
        PORT: "3000"            # constant
        PUBLIC_API_BASE: "/"    # constant: same-origin SSR proxy
        ORIGIN: "{{ .ORIGIN }}"         # from Bao
        API_BASE: "{{ .API_BASE }}"     # from Bao
  data:
    - secretKey: ORIGIN
      remoteRef: { key: earendil/production, property: ORIGIN }
    - secretKey: API_BASE
      remoteRef: { key: earendil/production, property: API_BASE }
