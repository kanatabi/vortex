# Production view of earendil: same base manifests, but env comes from
# OpenBao via ESO instead of inline literals (architecture doc §5.3).
# Bao paths follow kv/{app}/{env}: values live at kv/data/earendil/production.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../applications/earendil
  - externalsecret.yaml

patches:
  # Swap the inline env block for the ESO-generated ConfigMap.
  - target:
      kind: Deployment
      name: earendil-web-server
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/env
      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value:
          - configMapRef: { name: app-config }
