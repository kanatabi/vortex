# Production view of earendil: same base manifests, but env comes from
# OpenBao via ESO instead of inline literals (architecture doc §5.3).
# Bao paths follow kv/{app}/{env}: values live at kv/data/earendil/production.
# Cluster SHAPE: the VPS is one node (owner decision 2026-11-10, same as the
# rehearsal) — the single-node component collapses the 2-replica anti-affinity
# pair; selfsigned is NOT chained (real ACME TLS, see applications/certificates).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../applications/earendil
  - externalsecret.yaml

components:
  - ../../../components/single-node
  - ../../../components/config-gate

# The config-gate Job (rendered by the component into THIS namespace) runs the
# lumen binary — same image/tag the backend itself ships, deliberately. The
# name below must match the component's container image exactly (`lumen`).
# LOCKSTEP: bump tooling edits ghcr.io/kanatabi/lumen newTag HERE, in
# overlays/production/lumen, and overlays/production/mellon in ONE commit —
# a gate decoder older than the app's config epoch is how drift starts.
images:
  - name: lumen
    newName: ghcr.io/kanatabi/lumen
    newTag: v2.2.0

# TLS ownership moves to the certificates app here (PR feat/certificates-app):
# the explicit Certificate gofar-id renders Secret tls-gofar; the base's
# cert-manager.io/cluster-issuer annotation would make the ingress-shim
# auto-create a SHADOW Certificate (own name, own Secret) for the same
# hostnames — double issuance against Let's Encrypt rate limits for one
# serving door. So the prod overlay REMOVES the annotation (JSON6902, not a
# strategic-merge null: typed map[string]string merges COERCE null to the
# literal string "null" — the selfsigned component carries that quirk
# invisibly, harmless only because rehearsal clusters have no cert-manager
# to read it) and re-points spec.tls at tls-gofar (annotation gone => shim
# ignores the Ingress entirely; the Secret name match is the whole binding).
# Local rehearsal strips tls via components/selfsigned instead; the base
# keeps the annotation-only shape for the 3-node blueprint.
patches:
  - target:
      kind: Ingress
      name: earendil-web-server
    patch: |-
      - op: remove
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
      - op: replace
        path: /spec/tls
        value:
          - secretName: tls-gofar
            hosts:
              - gofar.id
              - www.gofar.id

# THE EPOCH PAIR — the annotation value and the gate's --declared arg below
# must stay byte-equal ("0" today); the bump flow edits BOTH lines in one
# commit (CI asserts the equality). One Deployment here -> both targets hit it.
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: unused
      spec:
        template:
          metadata:
            annotations:
              # Strategic merge: creates the annotations map (the base SSR pod
              # has none) and leaves everything else intact.
              omicron/config.epoch: "0"
  - target:
      kind: Job
      name: config-gate
    patch: |-
      # Full-args replacement (never element-wise) — see component header.
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: ["config", "check-epoch", "--app", "earendil", "--env", "production", "--declared", "0"]
