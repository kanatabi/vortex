# Backend secret material — rendered as a real K8s Secret by ESO (default target
# type) into `lumen-secrets`, matching both deployments' envFrom.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secrets
  namespace: lumen
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bao
    kind: ClusterSecretStore
  target:
    name: lumen-secrets
  data:
    - secretKey: DATABASE_URL        # -> postgres://db_user_production:...@lumen-pg-postgres.db.svc/lumen_production
      remoteRef: { key: lumen/production, property: DATABASE_URL }
    - secretKey: MEILI_MASTER_KEY
      remoteRef: { key: lumen/production, property: MEILI_MASTER_KEY }
    - secretKey: MEILI_HOST
      remoteRef: { key: lumen/production, property: MEILI_HOST }
