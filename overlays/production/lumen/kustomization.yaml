# Production view of lumen. NO deployment patch needed: the base already declares
# envFrom secretRef lumen-secrets (optional:true) — ESO simply MATERIALIZES that
# Secret here; in k3d it stays absent (dev behavior). Bao paths: kv/{app}/{env}.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../applications/lumen
  - externalsecret.yaml

# Single-node VPS shape (owner decision 2026-11-10): collapses the 2-replica
# http-server anti-affinity pair. No selfsigned — real TLS via the certificates app.
components:
  - ../../../components/single-node
