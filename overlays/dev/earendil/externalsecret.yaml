# Local-cluster twin of the production config feed; Bao path kv/data/earendil/dev.
# API_BASE here = whatever the rehearsal cluster names the lumen service; that is a
# VALUE (seeded in local Bao), never a Git concern.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frontend-config
  namespace: earendil
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bao
    kind: ClusterSecretStore
  target:
    name: app-config
    template:
      type: ConfigMap
      data:
        PORT: "3000"
        PUBLIC_API_BASE: "/"
        API_BASE: "{{ .API_BASE }}"
  data:
    - secretKey: API_BASE
      remoteRef: { key: earendil/dev, property: API_BASE }
