# Local-cluster twin of the production feed: same env contract, Bao path
# kv/data/lumen/dev. Deferred families (MEDIA_*, BAO_* bootstrap) — see the
# production CR header; doctrine is identical at every env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secrets
  namespace: lumen
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bao
    kind: ClusterSecretStore
  target:
    name: lumen-secrets
  data:
    - secretKey: LUMEN_DB_URL            # local: the k3d postgres (or placeholder) service
      remoteRef: { key: lumen/dev, property: LUMEN_DB_URL }
    - secretKey: LUMEN_MEILI_URL
      remoteRef: { key: lumen/dev, property: LUMEN_MEILI_URL }
    - secretKey: LUMEN_MEILI_KEY
      remoteRef: { key: lumen/dev, property: LUMEN_MEILI_KEY }
    - secretKey: LUMEN_SESSION_JWT_SECRET
      remoteRef: { key: lumen/dev, property: LUMEN_SESSION_JWT_SECRET }
