# Local twin of the production portal config; Bao path kv/data/mellon/dev.
# API_BASE value = whatever the cluster names the lumen service — a VALUE, so
# it lives in Bao (seeded per runbook), never in Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portal-config
  namespace: mellon
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bao
    kind: ClusterSecretStore
  target:
    name: app-config
    template:
      type: ConfigMap
      data:
        PORT: "3000"
        API_BASE: "{{ .API_BASE }}"
  data:
    - secretKey: API_BASE
      remoteRef: { key: mellon/dev, property: API_BASE }
