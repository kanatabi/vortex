# Staging portal config feed — Bao path kv/data/mellon/staging.
# target.name is the FINAL literal (app-config-staging): the build's
# nameSuffix rewrites this object's metadata.name only; the Deployment's
# envFrom reference is patched to match (see kustomization header).
#
# DUAL-UPSTREAM CONTRACT (mellon 1c07144, src/lib/api/routing.ts): the
# relay routes Control Plane paths to ADMIN_URL and content paths to
# CMS_URL. SEEDING CONTRACT (runbook / kv seeds):
#   kv/mellon/shared  property ADMIN_URL =
#     http://lumen-admin.lumen.svc.cluster.local   (estate-wide — one admin;
#     if this env ever splits clusters, give kv/mellon/staging its own
#     ADMIN_URL and flip the remoteRef key below — one line, human PR)
#   kv/mellon/staging property CMS_URL =
#     http://lumen-http-server-staging.lumen.svc.cluster.local
#     (the -staging service DNS name — the naming contract guarantees it
#     exists; the VALUE lives in Bao, never in Git)
# API_BASE is the legacy single-upstream key (still honored when the two
# new ones are absent). Kept TRANSITIONALLY for the v1.1.0 pods that read
# it — a restarted old pod without it silently falls back to localhost:8080.
# DROP RULE: after the dual-upstream image is the only mellon deployment
# live, a follow-up human PR removes the API_BASE entry and line.
# The portal is UI-only (mellon DESIGN §2): it relays to lumen over its own
# same-origin proxy; no credentials here beyond the relay contract.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portal-config            # -> portal-config-staging via nameSuffix
  annotations:
    # EPOCH TRIO, third line: == pod annotation == gate --declared.
    omicron/config.epoch: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bao
    kind: ClusterSecretStore
  target:
    name: app-config-staging      # FINAL NAME — suffix never rewrites this
    manifest:                     # ESO 2.x GENERIC TARGET: create this resource kind
      apiVersion: v1              # instead of a Secret. There is NO spec.target.type
      kind: ConfigMap             # in the 2.15 CRD — see overlays-era doctrine.
    template:
      data:
        PORT: "3000"
        PROTOCOL_HEADER: "x-forwarded-proto"   # adapter-node: trust the EDGE's forwarded
        HOST_HEADER: "x-forwarded-host"        # headers for origin derivation (the
        #                     # CSRF story that killed the first live walk — same
        #                     # contract at staging; NO PORT_HEADER, see prod twin).
        API_BASE: "{{ .API_BASE }}"     # from Bao — MUST be the -staging service DNS name (TRANSITIONAL, see header)
        ADMIN_URL: "{{ .ADMIN_URL }}"   # control-plane upstream (kv/mellon/shared)
        CMS_URL: "{{ .CMS_URL }}"       # this env's content upstream (kv/mellon/staging)
  data:
    - secretKey: API_BASE
      remoteRef: { key: mellon/staging, property: API_BASE }
    - secretKey: ADMIN_URL
      remoteRef: { key: mellon/shared, property: ADMIN_URL }
    - secretKey: CMS_URL
      remoteRef: { key: mellon/staging, property: CMS_URL }
