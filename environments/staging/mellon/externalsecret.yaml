# Staging portal config feed — Bao path kv/data/mellon/staging.
# target.name is the FINAL literal (app-config-staging): the build's
# nameSuffix rewrites this object's metadata.name only; the Deployment's
# envFrom reference is patched to match (see kustomization header).
#
# SEEDING CONTRACT (runbook / kv seeds): the API_BASE VALUE must name the
# suffixed staging backend —
#   kv/mellon/staging  property API_BASE =
#   http://lumen-http-server-staging.lumen.svc.cluster.local
# The portal is UI-only (mellon DESIGN §2): it relays to lumen over its own
# same-origin proxy; no credentials here beyond the relay contract.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portal-config            # -> portal-config-staging via nameSuffix
  annotations:
    # EPOCH TRIO, third line: == pod annotation == gate --declared.
    omicron/config.epoch: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bao
    kind: ClusterSecretStore
  target:
    name: app-config-staging      # FINAL NAME — suffix never rewrites this
    manifest:                     # ESO 2.x GENERIC TARGET: create this resource kind
      apiVersion: v1              # instead of a Secret. There is NO spec.target.type
      kind: ConfigMap             # in the 2.15 CRD — see overlays-era doctrine.
    template:
      data:
        PORT: "3000"
        PROTOCOL_HEADER: "x-forwarded-proto"   # adapter-node: trust the EDGE's forwarded
        HOST_HEADER: "x-forwarded-host"        # headers for origin derivation (the
        #                     # CSRF story that killed the first live walk — same
        #                     # contract at staging; NO PORT_HEADER, see prod twin).
        API_BASE: "{{ .API_BASE }}"     # from Bao — MUST be the -staging service DNS name
  data:
    - secretKey: API_BASE
      remoteRef: { key: mellon/staging, property: API_BASE }
