# Staging frontend config feed — Bao path kv/data/earendil/staging.
# target.name is the FINAL literal (app-config-staging): kustomize suffixes
# this object's metadata.name but never spec fields; the Deployment's
# envFrom reference is patched to match (see kustomization header).
#
# SEEDING CONTRACT (runbook / kv seeds): the API_BASE VALUE here must name
# the suffixed staging backend —
#   kv/earendil/staging  property API_BASE =
#   http://lumen-http-server-staging.lumen.svc.cluster.local
# — because the staging frontend talks to the staging cms fleet, never the
# production fleet. The manifest guarantees that Service name exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frontend-config          # -> frontend-config-staging via nameSuffix
  annotations:
    # EPOCH TRIO, third line: == pod annotation == gate --declared.
    omicron/config.epoch: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bao
    kind: ClusterSecretStore
  target:
    name: app-config-staging      # FINAL NAME — suffix never rewrites this
    manifest:                     # ESO 2.x GENERIC TARGET: create this resource kind
      apiVersion: v1              # instead of a Secret. There is NO spec.target.type
      kind: ConfigMap             # in the 2.15 CRD — see overlays-era doctrine.
    template:
      data:
        PORT: "3000"            # constant
        PUBLIC_API_BASE: "/"    # constant: same-origin SSR proxy
        API_BASE: "{{ .API_BASE }}"     # from Bao — MUST be the -staging service DNS name
  data:
    - secretKey: API_BASE
      remoteRef: { key: earendil/staging, property: API_BASE }
