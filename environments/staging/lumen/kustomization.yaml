# Staging view of lumen (environments tree, feat/environments-staging).
# One Patroni cluster (foundation, ns db) already serves lumen_staging; the
# shared Meilisearch (foundation, ns search) serves every environment under
# PER-ENV INDEX NAMES — LUMEN_MEILI_INDEX_* are values behind this overlay's
# Bao path (kv/lumen/staging), never manifests. Staging pods therefore read:
#   LUMEN_DB_URL  -> .../lumen-pg.db.svc/lumen_staging  (db_user_staging)
#   LUMEN_ROLE=cms inline (deployment IDENTITY, not config); LUMEN_ADMIN_URL
#   rides the ES below — an in-cluster service URL is a VALUE, and the estate
#   keeps those in Bao (LUMEN_MEILI_URL is the precedent).
#
# NAMING CONTRACT (sibling agents + vault seeding docs depend on this):
# nameSuffix "-staging" + labels transformer omicron/env=staging. Resources
# share the PRODUCTION namespaces (lumen here) — separation is the suffixed
# NAMES plus the env label in SELECTORS (includeSelectors:true gives Services
# and Deployment selectors the omicron/env pair, so a staging Service can
# never route to production pods and vice versa).
#
# THE TRAP the contract calls out: nameSuffix does NOT rewrite spec fields.
# Every reference below is therefore explicit — either authored to its final
# suffixed name (files THIS overlay owns: externalsecret.yaml, whose
# spec.target.name is the literal lumen-secrets-staging) or JSON6902-patched
# (references that live in the BASE files: the deployments' envFrom
# secretRef names, the migrate Job's envFrom, the gate args). The
# lumen-bao-credentials Secret is the ONE exception kept literal: it is a
# manual bootstrap-family object (§5.6), unversioned by Git, single instance
# per namespace, consumed un-suffixed by every role in this namespace.
#
# Patches target PRE-suffix names: kustomize applies patches before
# prefix/suffix (and before the labels/nameReference transformers) — verified
# against kustomize v5.8.1.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lumen
nameSuffix: -staging

resources:
- janitor.yaml
- ../../../bases/lumen
- externalsecret.yaml

components:
- ../../../components/single-node
- ../../../components/config-gate

# THE BASE NO LONGER PINS IMAGES (convergence 2026-11-13, fixture-proven: a
# base transformation rewrites the image BEFORE the overlay stanza can
# match — a base pin silently outranks every env tree). This stanza is the
# authority for the base's pods AND the component's gate Job (which joins
# here and resolves the still-bare `image: lumen` through this mapping).
# LOCKSTEP (SAME-ENV): bump tooling edits ghcr.io/kanatabi/lumen newTag
# HERE and in environments/staging/earendil + environments/staging/mellon
# in ONE commit — never another env's dirs; each env's gate decodes epochs
# with that env's lumen, so same-env travel is exactly what keeps the pair
# honest. (lumen v2.2.0 pinned across all three staging dirs today.)
images:
- name: lumen
  newName: ghcr.io/kanatabi/lumen
  newTag: v4.1.0

  # `ns lumen` is a CO-TENANT object (staging + production workloads share
  # it): both env trees would render it with DIFFERENT omicron/env labels
  # and fight on every selfHeal pass. Ownership is therefore foundation-side
  # (bases/*/namespace.yaml is deleted out of every env-tree build;
  # environments/foundation/lumen renders all three app namespaces
  # once, labeled omicron/env=shared — the truthful plane: shared plumbing).
  # $patch: delete runs before the labels transformer — so the Namespace
  # never sees one here.

  # envFrom -> the suffixed Secret this overlay's ES materializes.
  # (ES spec.target.name needs no patch — externalsecret.yaml is authored
  # with the final literal name; the nameSuffix leaves spec fields alone.)

  # CMS role: deployment IDENTITY, deliberately inline (vault must never be
  # able to silently re-role a fleet). LUMEN_ADMIN_URL is NOT inline — it is
  # a config VALUE (service URL) and rides the ES above like every other
  # in-cluster endpoint; the literal-ban battery stays strict (convergence
  # ruling 2026-11-13: the exemption was NOT granted, the value moved).

  # THE EPOCH TRIO — annotation value == gate --declared == ES annotation,
  # byte-equal ("0" — staging boots at epoch 0; the bump flow edits all
  # three lines in one commit, CI asserts the pair).
      # Full-args replacement (never element-wise) — see component header.
    # Full-args replacement (never element-wise) — see component header.
# nameSuffix leaves SPEC fields alone (the trap noted at the top): the
# gate hook's pod spec and the binding's refs stay LITERAL — pinned to
# the suffix THIS tree renders (SA/Role metadata.names get it from
# nameSuffix).
    # Full-args replacement (never element-wise) — see component header.
patches:
- patch: |-
    $patch: delete
    apiVersion: v1
    kind: Namespace
    metadata:
      name: lumen
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/envFrom/0/secretRef/name
      value: lumen-secrets-staging
  target:
    kind: Deployment
    name: lumen-http-server
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/envFrom/0/secretRef/name
      value: lumen-secrets-staging
  target:
    kind: Deployment
    name: lumen-worker
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/envFrom/0/secretRef/name
      value: lumen-secrets-staging
  target:
    kind: Job
    name: lumen-migrate
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env
      value:
        - name: LUMEN_ROLE
          value: cms
  target:
    kind: Deployment
    name: lumen-http-server
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env
      value:
        - name: LUMEN_ROLE
          value: cms
  target:
    kind: Deployment
    name: lumen-worker
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: unused
    spec:
      template:
        metadata:
          annotations:
            omicron/config.epoch: "0"
  target:
    kind: Deployment
- patch: |-
    # Full-args replacement (never element-wise) — see component header.
    - op: replace
      path: /spec/template/spec/containers/0/args
      value: ["config", "check-epoch", "--app", "lumen", "--env", "staging", "--declared", "0"]
  target:
    kind: Job
    name: config-gate
- patch: |-
    - op: replace
      path: /spec/template/spec/serviceAccountName
      value: config-gate-staging
  target:
    kind: Job
    name: config-gate
- patch: |-
    - op: replace
      path: /roleRef/name
      value: config-gate-staging
    - op: replace
      path: /subjects/0/name
      value: config-gate-staging
  target:
    kind: RoleBinding
    name: config-gate

    # selectors participate: co-tenancy with production in ONE namespace
    # only holds if every staging selector is env-restricted. (includeTemplates
    # defaults true — pod templates carry the label for the Alloy env relabel.)
labels:
- includeSelectors: true
  pairs:
    omicron/env: staging
