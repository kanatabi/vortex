# Staging backend secret material — rendered by ESO as Secret
# lumen-secrets-staging (THE SUFFIXED NAME IS AUTHORED HERE, not derived:
# kustomize nameSuffix rewrites metadata.name — this object becomes
# backend-secrets-staging — but never spec fields, so spec.target.name must
# be written final and the deployments' envFrom patched to match; see the
# kustomization header). Bao path: kv/data/lumen/staging.
#
# Key names are 1:1 with what the ROLE BINDS — verified against the shipped
# role split (lumen ec16db5, `lumen config keys --role cms`), property ==
# secretKey, no translation. Notable members of the contract:
#   LUMEN_MEILI_INDEX_POSTS/_PHOTOS  per-env index names on the ONE shared
#                    Meilisearch (foundation, ns search) — staging indexes
#                    are distinct NAMES in the same engine (seed e.g.
#                    posts-staging/photos-staging; in-code defaults are the
#                    unsuffixed posts/photos, so staging MUST seed them or
#                    the two fleets share an index — the exact collapse this
#                    key exists to prevent).
#   LUMEN_MEDIA_PREFIX  key namespace inside the ONE shared R2 bucket
#                    (seed `staging/`); keeps staging writes out of
#                    production's object space while the bucket (and its
#                    CDN face) stays one config per estate.
#   LUMEN_ADMIN_URL  WHERE the shared control plane lives — an in-cluster
#                    service URL, and the estate already keeps those in Bao
#                    (LUMEN_MEILI_URL, LUMEN_DB_URL's host, earendil's
#                    API_BASE). Source path is lumen/shared because the
#                    admin is one estate-wide service; when an env ever
#                    splits to its own cluster, that env's remoteRef key
#                    flips to lumen/<env> with a tailnet URL — one line,
#                    human PR, exactly the contract's promotion path.
#   LUMEN_SESSION_JWT_SECRET deliberately ABSENT — role=cms never binds it
#                    (only lumen-admin holds signing keys; cms introspects
#                    sessions against POST /admin/session/verify).
#   LUMEN_ORIGIN deliberately ABSENT — bound by the config layer but no
#                    consumer in lumen reads it yet; ES renders what code
#                    READS, and the future reader lands with its data line
#                    in the same human PR (earendil's ORIGIN doctrine,
#                    same rule).
#   LUMEN_ROLE       inline env on the deployments — deployment IDENTITY,
#                    not configuration: which tree this overlay IS.
#                    Keeping it out of Bao means vault can never silently
#                    re-role a fleet.
# Deliberately NOT in this CR: LUMEN_BAO_* (bootstrap paradox family, §5.6 —
# the lumen-bao-credentials Secret, literal-named; admin-role only anyway).
#
# SEEDING ORDER (cutover doctrine): every secretKey here must exist at its
# Bao path BEFORE this CR syncs — ESO fails the whole Secret on a missing
# property, so the runbook seed step precedes the hub sync, always.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secrets          # -> backend-secrets-staging via nameSuffix
  namespace: lumen
  annotations:
    # EPOCH TRIO, third line: == pod-template annotation == --declared.
    omicron/config.epoch: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bao
    kind: ClusterSecretStore
  target:
    name: lumen-secrets-staging   # FINAL NAME — suffix never rewrites this
  data:
    - secretKey: LUMEN_DB_URL     # -> postgres://db_user_staging:...@lumen-pg.db.svc/lumen_staging
      remoteRef: { key: lumen/staging, property: LUMEN_DB_URL }
    - secretKey: LUMEN_MEILI_URL  # -> http://meilisearch.search.svc.cluster.local:7700 (ONE shared instance)
      remoteRef: { key: lumen/staging, property: LUMEN_MEILI_URL }
    - secretKey: LUMEN_MEILI_KEY
      remoteRef: { key: lumen/staging, property: LUMEN_MEILI_KEY }
    - secretKey: LUMEN_MEILI_INDEX_POSTS
      remoteRef: { key: lumen/staging, property: LUMEN_MEILI_INDEX_POSTS }
    - secretKey: LUMEN_MEILI_INDEX_PHOTOS
      remoteRef: { key: lumen/staging, property: LUMEN_MEILI_INDEX_PHOTOS }
    - secretKey: LUMEN_ADMIN_URL  # -> http://lumen-admin.lumen.svc.cluster.local
                                  # (estate-wide home; see header for the
                                  # split-cluster promotion path)
      remoteRef: { key: lumen/shared, property: LUMEN_ADMIN_URL }
    # GATE #9 provider = Cloudflare R2 (S3-compatible); values ONLY in Bao
    # (runbook/05–06). Staging shares the ONE bucket — LUMEN_MEDIA_PREFIX is
    # what keeps its objects apart (seed `staging/`, never empty).
    - secretKey: LUMEN_MEDIA_ENDPOINT   # https://<account-hash>.r2.cloudflarestorage.com
      remoteRef: { key: lumen/staging, property: LUMEN_MEDIA_ENDPOINT }
    - secretKey: LUMEN_MEDIA_REGION     # r2
      remoteRef: { key: lumen/staging, property: LUMEN_MEDIA_REGION }
    - secretKey: LUMEN_MEDIA_BUCKET     # omicron-media (configurable — split
      remoteRef: { key: lumen/staging, property: LUMEN_MEDIA_BUCKET }
      #                    the bucket later by seeding a different name)
    - secretKey: LUMEN_MEDIA_ACCESS_KEY
      remoteRef: { key: lumen/staging, property: LUMEN_MEDIA_ACCESS_KEY }
    - secretKey: LUMEN_MEDIA_SECRET_KEY
      remoteRef: { key: lumen/staging, property: LUMEN_MEDIA_SECRET_KEY }
    - secretKey: LUMEN_MEDIA_CDN_BASE   # the public read face (staging may
      remoteRef: { key: lumen/staging, property: LUMEN_MEDIA_CDN_BASE }
      #                    share img.gofar.id — prefix keeps keys disjoint)
    - secretKey: LUMEN_MEDIA_FORCE_PATH # R2 is happy with virtual-host style: "false"
      remoteRef: { key: lumen/staging, property: LUMEN_MEDIA_FORCE_PATH }
    - secretKey: LUMEN_MEDIA_PREFIX     # staging/
      remoteRef: { key: lumen/staging, property: LUMEN_MEDIA_PREFIX }
