# Staging backend secret material — rendered by ESO as Secret
# lumen-secrets-staging (THE SUFFIXED NAME IS AUTHORED HERE, not derived:
# kustomize nameSuffix rewrites metadata.name — this object becomes
# backend-secrets-staging — but never spec fields, so spec.target.name must
# be written final and the deployments' envFrom patched to match; see the
# kustomization header). Bao path: kv/data/lumen/staging.
#
# Key names are 1:1 with the app's env contract — property == secretKey,
# no translation. CONTRACT FLAGS (role split lands in parallel in the lumen
# repo; these key names are the AGREED contract, not current-main bindings):
#   LUMEN_MEILI_INDEX_*  per-env index names on the ONE shared Meilisearch
#                    (foundation, ns search) — staging indexes are distinct
#                    NAMES in the same engine; the values are kv/lumen/staging
#                    seeds (e.g. posts_staging), the keys are the contract.
#   LUMEN_ROLE / LUMEN_ADMIN_URL are NOT here — structural, non-secret,
#                    inline env on the deployments (see kustomization).
# Deliberately NOT in this CR: LUMEN_BAO_* (bootstrap paradox family, §5.6 —
# the lumen-bao-credentials Secret, literal-named, shared per namespace).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secrets          # -> backend-secrets-staging via nameSuffix
  annotations:
    # EPOCH TRIO, third line: == the pod-template annotation == --declared.
    omicron/config.epoch: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bao
    kind: ClusterSecretStore
  target:
    name: lumen-secrets-staging   # FINAL NAME — suffix never rewrites this
  data:
    - secretKey: LUMEN_DB_URL     # -> postgres://db_user_staging:...@lumen-pg.db.svc/lumen_staging
      remoteRef: { key: lumen/staging, property: LUMEN_DB_URL }
    - secretKey: LUMEN_MEILI_URL  # -> http://meilisearch.search.svc.cluster.local:7700 (ONE shared instance)
      remoteRef: { key: lumen/staging, property: LUMEN_MEILI_URL }
    - secretKey: LUMEN_MEILI_KEY
      remoteRef: { key: lumen/staging, property: LUMEN_MEILI_KEY }
    - secretKey: LUMEN_SESSION_JWT_SECRET
      remoteRef: { key: lumen/staging, property: LUMEN_SESSION_JWT_SECRET }
    # --- per-env INDEX contract on the shared search engine (values via Bao,
    # keys via this CR; seed docs: runbook kv/lumen/staging).
    - secretKey: LUMEN_MEILI_INDEX_POSTS
      remoteRef: { key: lumen/staging, property: LUMEN_MEILI_INDEX_POSTS }
    - secretKey: LUMEN_MEILI_INDEX_PREFIX
      remoteRef: { key: lumen/staging, property: LUMEN_MEILI_INDEX_PREFIX }
