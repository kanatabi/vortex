# Production view of mellon (environments tree — re-homed from
# overlays/production/mellon, feat/environments-production).
# Base manifests + the ESO render chain at kv/mellon/production. Same
# doctrine everywhere: zero config literals in the base, env arrives as the
# suffixed app-config-production ConfigMap.
#
# NAMING CONTRACT: nameSuffix "-production" + labels omicron/env=production
# (includeSelectors). Mechanics + the spec-field trap: read
# environments/staging/lumen/kustomization.yaml first; identical rules.
# Real TLS via the certificates app (console.gofar.id is
# surface #2, TLS mandatory; the staging twin is staging-console.gofar.id).
#
# VAULT-VALUE CONTRACT (seeding docs / runbook): kv/mellon/production
# property API_BASE MUST be
#   http://lumen-http-server-production.lumen.svc.cluster.local
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mellon
nameSuffix: -production

resources:
- ../../../bases/mellon
- externalsecret.yaml
- ingress.yaml

components:
- ../../../components/single-node
- ../../../components/config-gate

# The config-gate Job runs the lumen binary — LOCKSTEP tag, see the note in
# environments/production/earendil (the lumen-production bump edits every
# `lumen` stanza under environments/production/* in ONE commit).
images:
- name: lumen
  newName: ghcr.io/kanatabi/lumen
  newTag: v3.0.0
- name: mellon
  newName: ghcr.io/kanatabi/mellon
  newTag: v2.0.0

  # `ns mellon` is a CO-TENANT object — deleted here; foundation-owned
  # (environments/foundation/lumen; story in
  # environments/staging/lumen/kustomization.yaml).

  # TLS ownership -> the authored ingress.yaml (see that file for the full
  # story incl. GATE #10). Explicit Certificate console-gofar-id renders
  # tls-console — UNSUFFIXED on purpose (foundation-plane cert app);
  # annotation-free so the ingress-shim can never double-issue; the backend
  # service name is stated final.

  # envFrom -> the suffixed ConfigMap this overlay's ES renders.

  # THE EPOCH TRIO — annotation == --declared == ES annotation ("0").
      # Full-args replacement (never element-wise) — see component header.
    # Full-args replacement (never element-wise) — see component header.
patches:
- patch: |-
    $patch: delete
    apiVersion: v1
    kind: Namespace
    metadata:
      name: mellon
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/envFrom/0/configMapRef/name
      value: app-config-production
  target:
    kind: Deployment
    name: mellon-web-server
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: unused
    spec:
      template:
        metadata:
          annotations:
            omicron/config.epoch: "0"
  target:
    kind: Deployment
- patch: |-
    # Full-args replacement (never element-wise) — see component header.
    - op: replace
      path: /spec/template/spec/containers/0/args
      value: ["config", "check-epoch", "--app", "mellon", "--env", "production", "--declared", "0"]
  target:
    kind: Job
    name: config-gate

labels:
- includeSelectors: true
  pairs:
    omicron/env: production
