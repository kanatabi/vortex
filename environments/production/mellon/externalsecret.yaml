# Production view of the portal config; Bao path kv/data/mellon/production.
# Upstream URL values live in Bao (seeded per runbook), never in Git.
# DUAL-UPSTREAM CONTRACT (mellon 1c07144, src/lib/api/routing.ts):
#   kv/mellon/shared  property ADMIN_URL =
#     http://lumen-admin.lumen.svc.cluster.local   (estate-wide — one admin;
#     split-cluster promotion: give kv/mellon/production its own ADMIN_URL
#     and flip the remoteRef key below — one line, human PR)
#   kv/mellon/production property CMS_URL =
#     http://lumen-http-server-production.lumen.svc.cluster.local (suffixed
#     by the naming contract; the manifest guarantees the name)
# API_BASE (legacy single-upstream key) is kept TRANSITIONALLY for the
# v1.1.0 pods that read it — drop it by human PR once the dual-upstream
# image is the only deployment live (see staging twin for the full rule).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portal-config            # -> portal-config-production via nameSuffix
  namespace: mellon
  annotations:
    # EPOCH TRIO, third line: == pod-template annotation == gate --declared.
    omicron/config.epoch: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bao
    kind: ClusterSecretStore
  target:
    name: app-config-production   # FINAL NAME (suffix never rewrites spec —
    #                    # consumed by the patched Deployment envFrom)
    manifest:                     # ESO 2.x GENERIC TARGET: create this resource kind
      apiVersion: v1              # instead of a Secret. There is NO spec.target.type
      kind: ConfigMap             # in the 2.15 CRD (schema: creationPolicy|deletionPolicy|
    #                              # immutable|manifest|name|template) — a `type:` field is
    #                              # silently PRUNED by the apiserver. Learned twice on the
    #                              # live walk 2026-11-10: template.type (a no-op) and then
    #                              # target.type (pruned) before the CRD said the truth.

    template:
      data:
        PORT: "3000"
        PROTOCOL_HEADER: "x-forwarded-proto"   # adapter-node: trust the EDGE's forwarded
        HOST_HEADER: "x-forwarded-host"        # headers for origin derivation. Without
        #                     # these the adapter assumes https://host —
        #                     # and Kit's CSRF check then rejects every HTTP form POST
        #                     # (live walk 2026-11-10: portal login 403'd through ANY
        #                     #  path because the pod thought its self-origin was https).
        # NO PORT_HEADER: every real edge is implicit 80/443 (URL normalisation drops
        # them) — trusting x-forwarded-port BREAKS the local NodePort rehearsal
        # (Traefik reports its entrypoint 80 while the browser lives on :30080 ->
        # malformed self-origin -> 400). Verified: without it, both port shapes 401.
        API_BASE: "{{ .API_BASE }}"     # TRANSITIONAL legacy key (see header)
        ADMIN_URL: "{{ .ADMIN_URL }}"   # control-plane upstream (kv/mellon/shared)
        CMS_URL: "{{ .CMS_URL }}"       # production's content upstream (kv/mellon/production)
  data:
    - secretKey: API_BASE
      remoteRef: { key: mellon/production, property: API_BASE }
    - secretKey: ADMIN_URL
      remoteRef: { key: mellon/shared, property: ADMIN_URL }
    - secretKey: CMS_URL
      remoteRef: { key: mellon/production, property: CMS_URL }
