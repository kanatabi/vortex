# Production secret material — rendered as a real K8s Secret by ESO (default
# target type) into `lumen-secrets-production`. THE SUFFIXED TARGET IS
# AUTHORED FINAL: nameSuffix rewrites this CR's metadata.name only, never
# spec.target.name — the deployments' envFrom references are patched to
# match (see kustomization; the naming-contract trap list).
# Key names are 1:1 with what the ROLE BINDS (lumen ec16db5,
# `lumen config keys --role cms`): property == secretKey, no translation —
# the kv tree literally mirrors the app's env contract. (The old
# DATABASE_URL/MEILI_HOST/MEILI_MASTER_KEY trio was contract drift: envFrom
# would have injected names lumen never looks at.)
# Deliberately NOT in this CR:
#   LUMEN_SESSION_JWT_SECRET — role=cms never binds it; only lumen-admin
#                    holds signing keys (sessions are introspected via
#                    POST /admin/session/verify). Old vault copies of this
#                    key at lumen/production become inert once the
#                    role-split image rolls — rotation belongs to admin.
#   LUMEN_ROLE=cms   inline env on the deployments — deployment IDENTITY,
#                    not configuration; vault can never silently re-role
#                    the fleet.
#   LUMEN_ORIGIN     bound but no consumer in lumen reads it yet; a data
#                    line lands WITH its reader, never before.
#   LUMEN_MEDIA_CREATE_BUCKET — dev-only escape hatch (see internal/config:
#                    prod never auto-creates buckets; the R2 bucket is made
#                    once in the dashboard, runbook/06).
#   LUMEN_BAO_*    — the relay AppRole creds cannot ride an ExternalSecret
#                    (bootstrap paradox: those keys unlock the very store
#                    that renders them). §5.6 manual bootstrap family, and
#                    admin-role only since the split.
#   LUMEN_PORT     — in-code default 8080; the deployments own the port contract.
# SEEDING ORDER: every secretKey here must exist at its Bao path BEFORE
# this CR syncs (ESO fails the whole Secret on a missing property) — the
# runbook seed step precedes the hub sync. LUMEN_ADMIN_URL,
# LUMEN_MEILI_INDEX_PHOTOS and LUMEN_MEDIA_PREFIX are NEW properties this
# contract demands: re-seed kv/lumen/{production,shared} before syncing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secrets          # -> backend-secrets-production via nameSuffix
  namespace: lumen
  annotations:
    # EPOCH TRIO, third line: == pod-template annotation == gate --declared.
    # (Bump flow edits all three lines in ONE commit; CI asserts equality.)
    omicron/config.epoch: "7"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bao
    kind: ClusterSecretStore
  target:
    name: lumen-secrets-production   # FINAL NAME — suffix never rewrites this
  data:
    - secretKey: LUMEN_DB_URL            # -> postgres://db_user_production:...@lumen-pg.db.svc/lumen_production
      remoteRef: { key: lumen/production, property: LUMEN_DB_URL }
    - secretKey: LUMEN_MEILI_URL         # -> http://meilisearch.search.svc.cluster.local:7700
                                         # (ns is `search` — the destination in
                                         # apps/foundation/meilisearch-app.yaml;
                                         # the old comment said meilisearch.svc,
                                         # a namespace that never existed. The
                                         # 503-on-the-feed incident lives here.)
      remoteRef: { key: lumen/production, property: LUMEN_MEILI_URL }
    - secretKey: LUMEN_MEILI_KEY
      remoteRef: { key: lumen/production, property: LUMEN_MEILI_KEY }
    # --- per-env INDEX contract on the ONE shared Meilisearch (foundation,
    # ns search): staging/production coexist as distinct INDEX NAMES. The
    # in-code defaults (posts/photos) are production's — seeding them here
    # is still the explicit contract (a missing key fails the Secret, and
    # re-pointing production's indexes someday is a seed edit, not a code
    # edit).
    - secretKey: LUMEN_MEILI_INDEX_POSTS
      remoteRef: { key: lumen/production, property: LUMEN_MEILI_INDEX_POSTS }
    - secretKey: LUMEN_MEILI_INDEX_PHOTOS
      remoteRef: { key: lumen/production, property: LUMEN_MEILI_INDEX_PHOTOS }
    - secretKey: LUMEN_ADMIN_URL  # -> http://lumen-admin.lumen.svc.cluster.local
                                  # (estate-wide home at lumen/shared; if
                                  # production ever splits clusters, flip
                                  # this remoteRef to lumen/production with
                                  # the cross-cluster URL — one line, human PR)
      remoteRef: { key: lumen/shared, property: LUMEN_ADMIN_URL }
    # GATE #9 closed 2026-11-13: provider = Cloudflare R2 (S3-compatible).
    # Values live ONLY in Bao — runbook/05 seeds kv/lumen/production with all
    # of these; runbook/06 has the bucket/domain steps. The CR and the seed
    # agree BY CONSTRUCTION: property == secretKey, 1:1 with the env contract.
    - secretKey: LUMEN_MEDIA_ENDPOINT   # https://<account-hash>.r2.cloudflarestorage.com
      remoteRef: { key: lumen/production, property: LUMEN_MEDIA_ENDPOINT }
    - secretKey: LUMEN_MEDIA_REGION     # r2 (any non-empty string works; R2 is signature-region-agnostic)
      remoteRef: { key: lumen/production, property: LUMEN_MEDIA_REGION }
    - secretKey: LUMEN_MEDIA_BUCKET     # omicron-media (configurable — a
      remoteRef: { key: lumen/production, property: LUMEN_MEDIA_BUCKET }
      #                    per-env bucket is a seed change, not a manifest one)
    - secretKey: LUMEN_MEDIA_ACCESS_KEY
      remoteRef: { key: lumen/production, property: LUMEN_MEDIA_ACCESS_KEY }
    - secretKey: LUMEN_MEDIA_SECRET_KEY
      remoteRef: { key: lumen/production, property: LUMEN_MEDIA_SECRET_KEY }
    - secretKey: LUMEN_MEDIA_CDN_BASE   # https://img.gofar.id — the public read face
      remoteRef: { key: lumen/production, property: LUMEN_MEDIA_CDN_BASE }
    - secretKey: LUMEN_MEDIA_FORCE_PATH # R2 is happy with virtual-host style: "false"
      remoteRef: { key: lumen/production, property: LUMEN_MEDIA_FORCE_PATH }
    - secretKey: LUMEN_MEDIA_PREFIX     # production/ — the key namespace in
      remoteRef: { key: lumen/production, property: LUMEN_MEDIA_PREFIX }
      #                    the ONE shared bucket (pairs with staging/)
