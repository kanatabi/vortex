# Values template for earendil — keys live in OpenBao at kv/data/earendil/production.
# Omit `version:` = always latest (drift-pulled every refreshInterval). Pin per config
# release (promotion flow, §5.4) by adding  remoteRef: { ..., version: "N" }  in a PR.
# ORIGIN returned 2026-11-13 exactly as its removal rule demanded — WITH its
# reader: earendil 1474ce8 bound it (src/env.ts + resolveOrigin; the Person
# JSON-LD). Production seeds https://gofar.id (the in-code default is the
# same value, but the ES renders the contract explicitly — what the app
# reads, the seed must hold).
# SEEDING CONTRACT (feat/environments): the API_BASE VALUE must name the
# suffixed backend — http://lumen-http-server-production.lumen.svc.cluster.local
# (the manifest guarantees that Service exists; the value lives in Bao).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frontend-config          # -> frontend-config-production via nameSuffix
  namespace: earendil
  annotations:
    # EPOCH TRIO, third line: == pod-template annotation == gate --declared.
    omicron/config.epoch: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bao
    kind: ClusterSecretStore
  target:
    name: app-config-production   # FINAL NAME (suffix never rewrites spec —
    #                    # consumed by the patched Deployment envFrom)
    manifest:                     # ESO 2.x GENERIC TARGET: create this resource kind
      apiVersion: v1              # instead of a Secret. There is NO spec.target.type
      kind: ConfigMap             # in the 2.15 CRD (schema: creationPolicy|deletionPolicy|
    #                              # immutable|manifest|name|template) — a `type:` field is
    #                              # silently PRUNED by the apiserver. Learned twice on the
    #                              # live walk 2026-11-10: template.type (a no-op) and then
    #                              # target.type (pruned) before the CRD said the truth.
    template:
      data:
        PORT: "3000"            # constant
        PUBLIC_API_BASE: "/"    # constant: same-origin SSR proxy
        API_BASE: "{{ .API_BASE }}"     # from Bao: internal service DNS (API has no public ingress)
        ORIGIN: "{{ .ORIGIN }}" # from Bao: https://gofar.id (see header)
  data:
    - secretKey: API_BASE
      remoteRef: { key: earendil/production, property: API_BASE }
    - secretKey: ORIGIN
      remoteRef: { key: earendil/production, property: ORIGIN }
