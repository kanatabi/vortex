# Production view of earendil (environments tree — re-homed from
# overlays/production/earendil, feat/environments-production).
# Env from OpenBao via ESO (architecture doc §5.3); Bao path
# kv/data/earendil/production. Cluster SHAPE: the VPS is one node (owner
# decision 2026-11-10) — the single-node component collapses the 2-replica
# anti-affinity pair; selfsigned is NOT chained (real ACME TLS, see
# applications/certificates).
#
# NAMING CONTRACT: nameSuffix "-production" + labels omicron/env=production
# (includeSelectors — env-restricted selectors are what make co-tenancy with
# the staging fleet safe). nameSuffix rewrites metadata.name only, so every
# name-bearing reference is explicit: envFrom configMapRef ->
# app-config-production (patched), ES target.name authored final, the
# Ingress backend stated final. The Ingress TLS Secret stays the UNSUFFIXED
# tls-gofar — the certificates app is foundation-plane plumbing synced
# un-suffixed from applications/certificates; suffixed Ingress names do not
# imply suffixed certificate Secrets.
#
# VAULT-VALUE CONTRACT (seeding docs / runbook): kv/earendil/production
# property API_BASE MUST be
#   http://lumen-http-server-production.lumen.svc.cluster.local
# — this build guarantees the suffixed Service name; the VALUE lives in Bao.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: earendil
nameSuffix: -production

resources:
  - ../../../applications/earendil
  - externalsecret.yaml

components:
  - ../../../components/single-node
  - ../../../components/config-gate

# The config-gate Job (rendered by the component into THIS namespace) runs
# the lumen binary — same tag the backend itself ships, deliberately.
# LOCKSTEP: bump tooling edits ghcr.io/kanatabi/lumen newTag HERE, in
# environments/production/lumen, environments/production/mellon,
# environments/staging/*, environments/foundation/lumen-admin and the bases,
# in ONE commit — a gate decoder older than the app's config epoch is how
# drift starts.
images:
  - name: earendil
    newName: ghcr.io/kanatabi/earendil
    newTag: v1.1.0
  - name: lumen
    newName: ghcr.io/kanatabi/lumen
    newTag: v2.2.0

# TLS ownership moves to the certificates app here (PR feat/certificates-app):
# the explicit Certificate gofar-id renders Secret tls-gofar; the base's
# cert-manager.io/cluster-issuer annotation would make the ingress-shim
# auto-create a SHADOW Certificate (own name, own Secret) for the same
# hostnames — double issuance against Let's Encrypt rate limits for one
# serving door. So the prod overlay REMOVES the annotation (JSON6902, not a
# strategic-merge null: typed map[string]string merges COERCE null to the
# literal string "null") and re-points spec.tls at tls-gofar (annotation
# gone => shim ignores the Ingress entirely; the Secret name match is the
# whole binding). The rules keep BOTH production hosts (www + apex — staging
# never wears www); the backend name is stated final per the naming contract.
patches:
  # `ns earendil` is a CO-TENANT object — deleted here; foundation-owned
  # (environments/foundation/lumen-admin; story in
  # environments/staging/lumen/kustomization.yaml).
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: earendil

  - target:
      kind: Ingress
      name: earendil-web-server
    patch: |-
      - op: remove
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
      - op: replace
        path: /spec/rules
        value:
          - host: www.gofar.id
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: earendil-web-server-production
                      port:
                        name: http
          - host: gofar.id
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: earendil-web-server-production
                      port:
                        name: http
      - op: replace
        path: /spec/tls
        value:
          - secretName: tls-gofar
            hosts:
              - gofar.id
              - www.gofar.id

  # envFrom -> the suffixed ConfigMap this overlay's ES renders (its
  # target.name is authored final in externalsecret.yaml).
  - target:
      kind: Deployment
      name: earendil-web-server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/configMapRef/name
        value: app-config-production

  # THE EPOCH TRIO — annotation == --declared == ES annotation ("0"); the
  # bump flow edits all three lines in one commit (CI asserts equality).
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: unused
      spec:
        template:
          metadata:
            annotations:
              omicron/config.epoch: "0"
  - target:
      kind: Job
      name: config-gate
    patch: |-
      # Full-args replacement (never element-wise) — see component header.
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: ["config", "check-epoch", "--app", "earendil", "--env", "production", "--declared", "0"]

labels:
  - pairs:
      omicron/env: production
    includeSelectors: true
