# Production view of earendil (environments tree — re-homed from
# overlays/production/earendil, feat/environments-production).
# Env from OpenBao via ESO (architecture doc §5.3); Bao path
# kv/data/earendil/production. Cluster SHAPE: the VPS is one node (owner
# decision 2026-11-10) — the single-node component collapses the 2-replica
# anti-affinity pair; TLS is real ACME (see
# bases/certificates).
#
# NAMING CONTRACT: nameSuffix "-production" + labels omicron/env=production
# (includeSelectors — env-restricted selectors are what make co-tenancy with
# the staging fleet safe). nameSuffix rewrites metadata.name only, so every
# name-bearing reference is explicit: envFrom configMapRef ->
# app-config-production (patched); the ES target AND the Ingress are
# authored final in this overlay's own files. The Ingress TLS Secret stays
# the UNSUFFIXED tls-gofar — the certificates app is foundation-plane
# plumbing synced un-suffixed from bases/certificates; suffixed
# Ingress names do not imply suffixed certificate Secrets.
#
# VAULT-VALUE CONTRACT (seeding docs / runbook): kv/earendil/production
# property API_BASE MUST be
#   http://lumen-http-server-production.lumen.svc.cluster.local
# — this build guarantees the suffixed Service name; the VALUE lives in Bao.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: earendil
nameSuffix: -production

resources:
- ../../../bases/earendil
- externalsecret.yaml
- ingress.yaml

components:
- ../../../components/single-node
- ../../../components/config-gate

# The config-gate Job (rendered by the component into THIS namespace) runs
# the lumen binary — same tag the backend itself ships, deliberately.
# LOCKSTEP (SAME-ENV — production): the lumen-production bump edits the
# `name: lumen` stanzas of environments/production/{lumen,earendil,mellon}
# in ONE commit — never staging's or foundation's dirs (each env's gate
# decodes with that env's lumen; the bases pin nothing since the
# convergence round). A gate decoder older than the app's config epoch is
# how drift starts.
images:
- name: earendil
  newName: ghcr.io/kanatabi/earendil
  newTag: v1.1.0
- name: lumen
  newName: ghcr.io/kanatabi/lumen
  newTag: v2.2.0

# TLS ownership -> the authored ingress.yaml (see that file for the full
# story: the explicit Certificate gofar-id renders tls-gofar — UNSUFFIXED,
# foundation-plane cert app — and it is annotation-free ON PURPOSE: the
# ingress-shim would double-issue a shadow Certificate for the same
# hostnames against LE rate limits; the Secret-name match is the whole
# binding). Both production hosts ride in the authored rules (www + apex —
# staging never wears www); the backend name is stated final per the
# naming contract.
  # `ns earendil` is a CO-TENANT object — deleted here; foundation-owned
  # (environments/foundation/lumen; story in
  # environments/staging/lumen/kustomization.yaml).


  # envFrom -> the suffixed ConfigMap this overlay's ES renders (its
  # target.name is authored final in externalsecret.yaml).

  # THE EPOCH TRIO — annotation == --declared == ES annotation ("0"); the
  # bump flow edits all three lines in one commit (CI asserts equality).
      # Full-args replacement (never element-wise) — see component header.
patches:
- patch: |-
    $patch: delete
    apiVersion: v1
    kind: Namespace
    metadata:
      name: earendil
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/envFrom/0/configMapRef/name
      value: app-config-production
  target:
    kind: Deployment
    name: earendil-web-server
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: unused
    spec:
      template:
        metadata:
          annotations:
            omicron/config.epoch: "0"
  target:
    kind: Deployment
- patch: |-
    # Full-args replacement (never element-wise) — see component header.
    - op: replace
      path: /spec/template/spec/containers/0/args
      value: ["config", "check-epoch", "--app", "earendil", "--env", "production", "--declared", "0"]
  target:
    kind: Job
    name: config-gate

labels:
- includeSelectors: true
  pairs:
    omicron/env: production
