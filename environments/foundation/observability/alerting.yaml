# The five estate alerts + the email contact point, Grafana-provisioning format
# (monitoring.grafana.com/v1alpha1 — unified alerting file provisioning, live
# since Grafana 10.4; image pinned 11.2.0). Mounted into the Grafana pod by the
# kustomization patch below at /etc/grafana/provisioning/alerting.
#
# Delivery model: one ContactPoint (email). No NotificationPolicy is provisioned
# — Grafana's DEFAULT unified-alerting policy fans out to every contact point,
# so the email below receives all five rules (simplest shape that renders valid
# provisioning YAML; a routing tree is a later, deliberate upgrade).
#
# Inert-by-design doctrine (mirrors the backup rule the brief calls out): every
# rule here is written against its TARGET metric name; where the exporter does
# not exist in-cluster yet, VictoriaMetrics returns no series, noDataState: OK
# keeps the rule green — the rules are harmless today and light up the moment
# their source lands, with zero further Git change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
data:
  estate.yaml: |
    apiVersion: monitoring.grafana.com/v1alpha1
    kind: ManagedFolder
    metadata:
      name: estate
    spec:
      title: Estate
    ---
    apiVersion: monitoring.grafana.com/v1alpha1
    kind: ContactPoint
    metadata:
      name: ops-email
    spec:
      email:
        - uid: ops-email
          # dev@gofar.id rides the SAME consciously-bent exception class as the
          # ACME contact in applications/certificates/issuer.yaml: a public
          # operational mailbox (identifiable from LE account metadata anyway),
          # not a secret and not app runtime config. The alert routing itself
          # is config-as-code; only this address could ever want Bao.
          settings:
            addresses: dev@gofar.id
          disableResolveMessage: false
    ---
    apiVersion: monitoring.grafana.com/v1alpha1
    kind: AlertRuleGroup
    metadata:
      name: estate-vital-signs
    spec:
      title: Estate vital signs
      folderRef: estate
      interval: 5m
      rules:
        # 1) TLS leaves <21 days of validity. ASSUMPTION: cert-manager exposes
        # certmanager_certificate_expiration_timestamp_seconds on its controller
        # :8080/metrics; the pinned v1.16.2 install is NOT yet annotated for the
        # Alloy pod-scrape contract -> rule inert until the annotation (or a
        # ServiceMonitor) lands. 21d = 1814400s; the 30d renew window means a
        # hit here = renewal is broken, not merely near.
        - title: TLS certificate expires in under 21 days
          condition: A
          for: 30m
          noDataState: OK
          errorState: OK
          data:
            - refId: A
              relativeTimeRange: { from: 600, to: 0 }
              datasourceUid: victoria-metrics
              model:
                refId: A
                instant: true
                intervalMs: 60000
                maxDataPoints: 60
                expr: '(certmanager_certificate_expiration_timestamp_seconds - time()) < 1814400'
        # 2) Backups stale > 36h. ASSUMPTION (documented in the brief): the
        # metric backup_last_success_timestamp_seconds is EXPORTED BY THE ch-M6
        # RESTIC TIMER once it exists; until then no series -> NoData -> OK.
        # 36h = 129600s: one missed nightly window + a full grace margin.
        - title: Backups stale (no success in 36h)
          condition: A
          for: 15m
          noDataState: OK
          errorState: OK
          data:
            - refId: A
              relativeTimeRange: { from: 600, to: 0 }
              datasourceUid: victoria-metrics
              model:
                refId: A
                instant: true
                intervalMs: 60000
                maxDataPoints: 60
                expr: '(time() - backup_last_success_timestamp_seconds) > 129600'
        # 3) Vault sealed. ASSUMPTION (simplest option of the blackbox/script/
        # gauge menu): OpenBao's NATIVE telemetry gauge bao_monitor_sealed
        # (1 = sealed) from /v1/sys/metrics — needs telemetry enabled in
        # server.hcl + an authenticated scrape (sys/metrics requires a token),
        # both ch-M6-family work; inert until then. KNOWN BLIND SPOT, stated
        # honestly: a SEALED Bao does not serve metrics, so the sealed case
        # arrives as NoData, which this rule maps to OK (inert-first doctrine);
        # the belt-and-braces upgrade is noDataState: Alert once an
        # always-on exporter (blackbox or node script hitting /sys/seal-
        # status) exists. Kept valid-YAML simple today; the assumption is Git-
        # reviewable, the gap is not silent.
        - title: OpenBao is sealed
          condition: A
          for: 5m
          noDataState: OK
          errorState: OK
          data:
            - refId: A
              relativeTimeRange: { from: 600, to: 0 }
              datasourceUid: victoria-metrics
              model:
                refId: A
                instant: true
                intervalMs: 60000
                maxDataPoints: 60
                expr: 'bao_monitor_sealed == 1'
        # 4) Pod restart spike. ASSUMPTION: kube-state-metrics is NOT yet
        # deployed (Phase 5 backlog) -> inert. >5 restarts for any container
        # inside 30m = crashloop territory, past the noise of a config rollout.
        - title: Pod restart spike (>5 restarts in 30m)
          condition: A
          for: 5m
          noDataState: OK
          errorState: OK
          data:
            - refId: A
              relativeTimeRange: { from: 1800, to: 0 }
              datasourceUid: victoria-metrics
              model:
                refId: A
                instant: true
                intervalMs: 60000
                maxDataPoints: 60
                expr: 'increase(kube_pod_container_status_restarts_total[30m]) > 5'
        # 5) Disk >80%. ASSUMPTION: node_filesystem_* needs node-exporter
        # (Phase 5 backlog — kubelet/cadvisor expose no host fs sizing) ->
        # inert until it ships with the scrape annotations. tmpfs/overlay/
        # squashfs excluded: container ephemerals are not the disk that fills.
        - title: Disk usage above 80%
          condition: A
          for: 15m
          noDataState: OK
          errorState: OK
          data:
            - refId: A
              relativeTimeRange: { from: 600, to: 0 }
              datasourceUid: victoria-metrics
              model:
                refId: A
                instant: true
                intervalMs: 60000
                maxDataPoints: 60
                expr: '100 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} * 100) > 80'
