# FOUNDATION plane view of observability: the same base + placement collapse
# (components/single-node). Re-homed from overlays/production/observability
# (feat/environments): Loki/VictoriaMetrics/Alloy/Grafana are shared estate
# plumbing — one instance, no per-env twins. Grafana's single door stays
# anor.gofar.id (production hosts the domain; the certificate lives in the
# foundation-owned certificates app, unchanged host, unchanged Secret).
#
# ENVIRONMENT ATTRIBUTION (owner ruling 2026-11-13): per-environment Alloy
# external_labels are NOT the mechanism — one Alloy fleet can't stamp what
# it isn't. Instead the Alloy pod-discovery pipeline copies the POD label
# omicron/env (shared|staging|production) into an `env` series/log label
# (see bases/observability/alloy/config.alloy); the env trees stamp
# that label on every pod template they render.
#
# SIZING AUDIT (the brief's budget vs the base, checked line by line):
#   VictoriaMetrics  retention 30d + 10Gi + 200m/384Mi -> 500m/512Mi   = BASE
#   Loki             retention 168h + 15Gi + 200m/512Mi -> 500m/800Mi  = BASE
#   Alloy (DaemonSet) 100m/128Mi -> 300m/256Mi                          = BASE
#   Grafana          100m/128Mi -> 300m/256Mi + 1Gi PVC                 = BASE
# The scaffold (feat/scaffold-observability-meilisearch) shipped exactly the
# §1 VPS budget, so this overlay adds NO sizing patches — inventing no-op
# patches would fake a drift that doesn't exist and give future drift a place
# to hide. What this overlay DOES own: the five estate alerts (alerting.yaml,
# mounted below) and any future per-VPS knob.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../bases/observability
  - alerting.yaml

components:
  - ../../../components/single-node

labels:
  - pairs:
      omicron/env: shared
    # selectors stay untouched (live workloads); pod TEMPLATES still receive
    # the label (includeTemplates defaults true) — which is exactly what the
    # Alloy env relabel consumes.
    includeSelectors: false
    includeTemplates: true

patches:
  # Wire the provisioning file family into Grafana's on-disk provisioning root.
  # Grafana loads every *.yaml under /etc/grafana/provisioning/<dir> at startup;
  # datasources keeps its existing mount, this ADDS the alerting one (strategic
  # merge on the name-keyed volume/volumeMount lists).
  - target:
      kind: Deployment
      name: grafana
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: unused
      spec:
        template:
          spec:
            containers:
              - name: grafana
                volumeMounts:
                  - { name: alerting, mountPath: /etc/grafana/provisioning/alerting, readOnly: true }
            volumes:
              - name: alerting
                configMap: { name: grafana-alerting }
