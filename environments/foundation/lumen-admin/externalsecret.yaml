# Admin secret material — rendered as Secret `lumen-admin-secrets` (ns
# lumen) from Bao path kv/data/lumen/shared: the ADMIN identity feeds both
# tenants' writes. Values: LUMEN_DB_URL points at the Patroni logical
# database lumen_admin owned by db_user_admin (credentials generated by the
# Zalando operator into its dotted-naming Secret; the DSN itself lives in
# Bao like everything else).
#
# CONTRACT FLAGS (the role-split PR lands in the lumen repo in parallel):
#   keys current main BINDS (internal/config): LUMEN_DB_URL, LUMEN_MEILI_URL,
#   LUMEN_MEILI_KEY, LUMEN_SESSION_JWT_SECRET, LUMEN_MEDIA_* — mirrored 1:1
#   below, property == secretKey.
#   AGREED contract keys (not yet main bindings; move with the role-split
#   PR if names change): LUMEN_ROLE (literal env, not here — non-secret),
#   LUMEN_ADMIN_URL (literal env — structural DNS), LUMEN_MEILI_INDEX_* —
#   the admin indexes on the ONE shared Meilisearch; shared-plane values at
#   kv/lumen/shared.
#   LUMEN_BAO_* (the relay AppRole trio) deliberately ABSENT — §5.6 k8s-
#   manual bootstrap family (lumen-bao-credentials), never an ES.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: admin-secrets            # -> Secret lumen-admin-secrets (target below;
  namespace: lumen               # foundation plane, NO suffix per contract)
  annotations:
    # EPOCH TRIO, third line (--app lumen --env shared): == pod annotation
    # == gate --declared.
    omicron/config.epoch: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bao
    kind: ClusterSecretStore
  target:
    name: lumen-admin-secrets
  data:
    - secretKey: LUMEN_DB_URL    # -> postgres://db_user_admin:...@lumen-pg.db.svc/lumen_admin
      remoteRef: { key: lumen/shared, property: LUMEN_DB_URL }
    - secretKey: LUMEN_MEILI_URL # -> http://meilisearch.search.svc.cluster.local:7700 (ONE shared instance)
      remoteRef: { key: lumen/shared, property: LUMEN_MEILI_URL }
    - secretKey: LUMEN_MEILI_KEY
      remoteRef: { key: lumen/shared, property: LUMEN_MEILI_KEY }
    - secretKey: LUMEN_SESSION_JWT_SECRET
      remoteRef: { key: lumen/shared, property: LUMEN_SESSION_JWT_SECRET }
    # --- CONTRACT (role split): admin index names on the shared engine.
    - secretKey: LUMEN_MEILI_INDEX_POSTS
      remoteRef: { key: lumen/shared, property: LUMEN_MEILI_INDEX_POSTS }
    - secretKey: LUMEN_MEILI_INDEX_PREFIX
      remoteRef: { key: lumen/shared, property: LUMEN_MEILI_INDEX_PREFIX }
    # --- media relay keys (GATE #9 provider: Cloudflare R2; values ONLY in
    # Bao — see runbook/05–06; 1:1 with the env contract, prod-twin doctrine).
    - secretKey: LUMEN_MEDIA_ENDPOINT
      remoteRef: { key: lumen/shared, property: LUMEN_MEDIA_ENDPOINT }
    - secretKey: LUMEN_MEDIA_REGION
      remoteRef: { key: lumen/shared, property: LUMEN_MEDIA_REGION }
    - secretKey: LUMEN_MEDIA_BUCKET
      remoteRef: { key: lumen/shared, property: LUMEN_MEDIA_BUCKET }
    - secretKey: LUMEN_MEDIA_ACCESS_KEY
      remoteRef: { key: lumen/shared, property: LUMEN_MEDIA_ACCESS_KEY }
    - secretKey: LUMEN_MEDIA_SECRET_KEY
      remoteRef: { key: lumen/shared, property: LUMEN_MEDIA_SECRET_KEY }
    - secretKey: LUMEN_MEDIA_CDN_BASE
      remoteRef: { key: lumen/shared, property: LUMEN_MEDIA_CDN_BASE }
    - secretKey: LUMEN_MEDIA_FORCE_PATH
      remoteRef: { key: lumen/shared, property: LUMEN_MEDIA_FORCE_PATH }
