# Schema migration for the ADMIN database (lumen_admin, owner
# db_user_admin) — the same lifecycle doctrine as bases/lumen's
# migrate Job (PreSync hook, must succeed or the sync blocks), but
# envFrom lumen-admin-secrets so `lumen migrate` runs against the admin
# DB, not a tenant's. The cms trees' migrate Jobs cover lumen_staging /
# lumen_production; nothing else creates lumen_admin's schema — without
# this Job the Control Plane crash-loops on first boot.
apiVersion: batch/v1
kind: Job
metadata:
  name: lumen-admin-migrate
  namespace: lumen
  labels:
    app: lumen-admin-migrate
  annotations:
    # NOT a PreSync hook (walked 2026-11-14): a hook runs BEFORE the sync
    # applies the admin-secrets ES — the Secret can't exist yet, so the
    # migrate deadlocked on every fresh cluster. Wave ordering instead:
    # ES (wave 0) must be Healthy (ESO-rendered) before wave 1 runs.
    argocd.argoproj.io/sync-wave: "1"
    # Bump-safe: Job pod templates are IMMUTABLE — an image bump (v3->v4)
    # can't patch the completed Job, so Argo retries "field is immutable"
    # forever (walked 2026-11-14, lumen-admin sync). Replace=true makes
    # Argo delete + re-create on the next sync: the bumped image's migrate
    # runs fresh; no manual corpse deletes, TTL timing no longer load-bearing.
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: lumen-admin-migrate
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-pool
                    operator: NotIn
                    values: ['platform']
      enableServiceLinks: false   # estate doctrine (see lumen base)
      containers:
        - name: migrate
          image: lumen
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          env:
            # migrate is LUMEN_ROLE-aware (v3.0.0 role split): without the
            # role it runs the legacy 'all' subset — cms tables would land
            # in lumen_admin. Same inline identity as the deployment.
            - name: LUMEN_ROLE
              value: admin
          envFrom:
            # optional:true — a missing Secret yields lumen's own loud config
            # error (clean Job failure, blocked sync), not an opaque
            # CreateContainerConfigError the hook would wait on till deadline.
            - secretRef: { name: lumen-admin-secrets, optional: true }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
