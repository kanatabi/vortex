# Admin secret material — rendered as Secret `lumen-admin-secrets` (ns
# lumen) from Bao path kv/data/lumen/shared: the ADMIN identity feeds both
# tenants' writes. Values: LUMEN_DB_URL points at the Patroni logical
# database lumen_admin owned by db_user_admin (credentials generated by the
# Zalando operator into its dotted-naming Secret; the DSN itself lives in
# Bao like everything else).
#
# THE DATA LIST IS THE ADMIN RENDER CONTRACT, verified against the SHIPPED
# role split (lumen 12b95c5, `lumen config keys --role admin`): the admin
# plane binds exactly LUMEN_DB_URL + LUMEN_SESSION_JWT_SECRET +
# LUMEN_WEBAUTHN_RP_ID + LUMEN_WEBAUTHN_ORIGINS + LUMEN_PORT (in-code
# default; the Deployment owns it) + LUMEN_ROLE (inline identity env,
# non-secret) + LUMEN_BAO_* (below). MEILI_*/MEDIA_* keys were dropped:
# role=admin never binds them — the control plane holds no content surface.
# Drift here is a bug class: an ES rendering what code never reads hides
# seeding errors forever.
#   The passkey pair (C1) is the relying-party identity. RP_ID is the
#   REGISTRABLE DOMAIN (gofar.id) — ONE shared admin serves console AND
#   staging-console, so the credential space is shared on purpose (the
#   role split shares identity, never content) — and the origins list is
#   the comma-separated browser origins allowed to run the ceremony. Both
#   unset on the pod = the passkey method is honestly OFF (the routes
#   404 "no such method" until the env arrives).
#   WIRE-NAME SEAM: the vault's live property for the origins list is the
#   pre-rename LUMEN_WEBAUTHN_ORIGIN. lumen 12b95c5 renamed the BINDING
#   (the canonical name is the plural), but the vault key kept its name:
#   the estate's per-app key SET is one shape across lumen/{shared,
#   staging,production}, and the admin relay's mirror reconciles a path's
#   shape toward the saved sibling's — a shared-only new key would be
#   stripped (with a version bump = an epoch desync) by the next cms save.
#   property -> secretKey mapping below IS the seam ESO exists to be.
#   LUMEN_BAO_* (the relay AppRole trio) deliberately ABSENT — §5.6 k8s-
#   manual bootstrap family (lumen-bao-credentials), never an ES.
#   LUMEN_ADMIN_URL also lives at kv/lumen/shared: it is the cms planes'
#   read of WHERE the admin is (rendered by environments/{staging,production}
#   /lumen's ES, not here — an app's Secret renders what that app binds).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: admin-secrets            # -> Secret lumen-admin-secrets (target below;
  namespace: lumen               # foundation plane, NO suffix per contract)
  annotations:
    # EPOCH TRIO, third line (--app lumen --env shared): == pod annotation
    # == gate --declared.
    omicron/config.epoch: "4"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bao
    kind: ClusterSecretStore
  target:
    name: lumen-admin-secrets
  data:
    - secretKey: LUMEN_DB_URL    # -> postgres://db_user_admin:...@lumen-pg.db.svc/lumen_admin
      remoteRef: { key: lumen/shared, property: LUMEN_DB_URL }
    - secretKey: LUMEN_SESSION_JWT_SECRET  # 32 random bytes, generated at
      remoteRef: { key: lumen/shared, property: LUMEN_SESSION_JWT_SECRET }
      #                    bootstrap (§5). THE ONLY HOME of the session
      #                    signing key: cms planes never see it — they
      #                    introspect POST /admin/session/verify instead
      #                    (revocation stays truthful everywhere).
    - secretKey: LUMEN_WEBAUTHN_RP_ID      # gofar.id — the registrable domain,
      remoteRef: { key: lumen/shared, property: LUMEN_WEBAUTHN_RP_ID }
      #                    never a console host: one admin, every env.
    - secretKey: LUMEN_WEBAUTHN_ORIGINS    # vault key keeps the pre-rename
      remoteRef: { key: lumen/shared, property: LUMEN_WEBAUTHN_ORIGIN }
      #                    SINGULAR (one key SET per app — see header); the
      #                    pod env is the canonical plural the code binds.
      #                    Value: comma-separated full origins.
