# FOUNDATION plane view of ESO: the base chart wrapper + placement collapse
# (the single-node component strips the valuesInline nodeSelectors — one
# doctrine covers chart apps too). Re-homed from
# overlays/production/external-secrets (feat/environments); foundation plane =
# shared plumbing for every environment, labeled omicron/env=shared, no suffix.
# The Application CR for this path MUST keep ServerSideApply=true: the
# chart's CRDs exceed the client-side last-applied 256KiB ceiling (PROVEN live
# 2026-11-10 — see apps/external-secrets-app.yaml for the full story).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../bases/external-secrets

components:
  - ../../../components/single-node

labels:
  - pairs:
      omicron/env: shared
    includeSelectors: false
    includeTemplates: true
