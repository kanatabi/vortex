# FOUNDATION hub (VPS entrypoint #1), wave 1: ClusterSecretStore bao. Its
# Ready condition gates every secret materialization in the estate: it stays
# NOT-Ready until runbook M3 seeds the vault, and the APPS hub — where the
# consumers live — is applied by hand only after M3. The seed-before-apps
# order moved from "wave number inside one hub" to "the two-hub entrypoint
# itself" (a design, not a suggestion).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-plane
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: 'https://github.com/kanatabi/vortex.git'
    targetRevision: HEAD
    path: overlays/production/secrets-plane
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
