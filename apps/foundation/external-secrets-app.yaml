# FOUNDATION hub (VPS entrypoint #1), wave 0: ESO. Same kustomize-helm wrapper as every
# other shape (chart pin 2.15.0 lives in applications/external-secrets), placement
# collapsed by the single-node component inside the overlay.
# ServerSideApply=true is MANDATORY here — fat chart CRDs vs the 256KiB
# last-applied ceiling (apps/external-secrets-app.yaml carries the proof story).
# Its CRDs gate everything the secrets plane touches.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: 'https://github.com/kanatabi/vortex.git'
    targetRevision: HEAD
    path: overlays/production/external-secrets
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: external-secrets
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
