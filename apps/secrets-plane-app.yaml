apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-plane
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # after ESO CRDs + OpenBao exist
spec:
  project: default
  source:
    repoURL: 'https://github.com/kanatabi/vortex.git'
    targetRevision: HEAD
    path: bases/secrets-plane
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
