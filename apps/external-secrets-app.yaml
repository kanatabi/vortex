# ESO installs as an Argo-managed OCI Helm chart — deliberately NOT a kustomize+helmCharts
# dir, so `kubectl kustomize` validation of this repo stays helm-free.
# MANUAL one-time step before first sync: kubectl create namespace external-secrets
# (the chart templates into .Release.Namespace; like the argocd bootstrap, this is an
# accepted manual exception — keep it in the runbook, not in Git).
# targetRevision: CONFIRM the chart version at first deploy and keep pinning the exact one.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: 'oci://ghcr.io/external-secrets/charts'
    chart: external-secrets
    targetRevision: '0.1.4'
    helm:
      releaseName: external-secrets
      values: |
        nodeSelector:
          node-pool: data
        webhook:
          nodeSelector:
            node-pool: data
        image:
          pullPolicy: IfNotPresent
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
