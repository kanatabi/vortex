# ESO installs as an Argo-managed OCI Helm chart — deliberately NOT a kustomize+helmCharts
# dir, so `kubectl kustomize` validation of this repo stays helm-free.
# MANUAL one-time step before first sync: kubectl create namespace external-secrets
# (the chart templates into .Release.Namespace; like the argocd bootstrap, this is an
# accepted manual exception — keep it in the runbook, not in Git).
# targetRevision '2.15.0' — SOURCED pin (raised from the stale 0.1.4 placeholder 2026-11-10,
# BEFORE any deploy — ESO has never been installed here, so there is no migration; pinning a
# placeholder was the bug). ESO unified operator+chart versioning in the 2.x line: one number
# means both. Bump deliberately (never auto-merge — the renovate lesson); the v1.5.0-era docs
# are gone (the tag 404s) and all our CRs already speak external-secrets.io/v1, stable in 2.x.
# FIRST-SYNC CHECKLIST (do once, in k3d rehearsal before prod):
#   1. kubectl create ns external-secrets (manual bootstrap, above)
#   2. chart kubeVersion vs `kubectl version` of the k3s actually installed
#   3. `helm show values oci://ghcr.io/external-secrets/charts/external-secrets --version 2.15.0`
#      — confirm nodeSelector / webhook.nodeSelector / image.pullPolicy keys still exist
#   4. operator pods Ready → then secrets-plane ClusterSecretStore `bao` goes Ready
#      (its app self-heals via Argo retry while the CRDs land — that is expected, not a fail)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: 'oci://ghcr.io/external-secrets/charts'
    chart: external-secrets
    targetRevision: '2.15.0'
    helm:
      releaseName: external-secrets
      values: |
        nodeSelector:
          node-pool: data
        webhook:
          nodeSelector:
            node-pool: data
        image:
          pullPolicy: IfNotPresent
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
