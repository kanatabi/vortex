# ESO installs as a kustomize helmCharts wrapper (applications/external-secrets) —
# see that dir's header for WHY not an Argo OCI-chart Application (2026-11-10
# rehearsal proof: neither Argo 2.13's helm-flag bug nor 3.6's Go OCI resolver
# survives ghcr's anonymous policy; the helm BINARY does, and kustomize calls it).
# The namespace is now a tracked resource — the old manual `create ns` bootstrap
# exception is dead.
# targetRevision/chart version '2.15.0' is the SOURCED pin (operator+chart unified
# since 2.x; raised from the stale 0.1.4 placeholder before any deploy — pinning a
# placeholder was the bug; bump deliberately, never auto-merge — the renovate lesson;
# the v1.5.0-era docs are gone: that tag 404s). FIRST-SYNC CHECKLIST (k3d/minikube
# rehearsal covers it — the 2026-11-10 walk executed steps 1-3 clean):
#   1. chart kubeVersion vs `kubectl version` of the cluster (2.15.0 fine vs k3s 1.37)
#   2. rendered values audit (nodeSelector/webhook/image keys survived 2.x — verified)
#   3. controller + webhook Deployment Ready -> THEN secrets-plane's
#      ClusterSecretStore `bao` can go Ready (its app self-heals via Argo retry
#      while the CRDs land — expected, not a failure)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: 'https://github.com/kanatabi/vortex.git'
    targetRevision: HEAD
    path: applications/external-secrets
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: external-secrets
  syncPolicy:
    # ServerSideApply: the chart's CRDs exceed the client-side last-applied
    # annotation's 256KiB ceiling (PROVEN live 2026-11-10, twice — host kubectl
    # apply and Argo's default path both fail identically). SSA is mandatory for
    # any fat-CRD chart, ours included.
    syncOptions:
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
