# APPS hub (VPS entrypoint #2), wave 2: observability, AFTER the estate it
# watches exists (grafana's config feeds consume the store — Ready long before
# this hub is applied at all — and grafana degrades to defaults via
# optional:true, never a blocked wave). The estate's only viewer:
# Alloy (DaemonSet) + Loki + VictoriaMetrics + Grafana at anor.gofar.id, sized
# to the §1 VPS budget, alerting via the provisioned five rules (PR history).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: 'https://github.com/kanatabi/vortex.git'
    targetRevision: HEAD
    path: overlays/production/observability
  # ESO's webhook DEFAULTS these spec fields server-side (creationPolicy,
  # deletionPolicy, template engineVersion/mergePolicy) — they never exist in
  # Git, so without this the app is PERPETUALLY OutOfSync and selfHeal would
  # thrash the ES forever. Discovered on the live walk 2026-11-10.
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.target.creationPolicy
        - .spec.target.deletionPolicy
        - .spec.target.template.engineVersion
        - .spec.target.template.mergePolicy
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
