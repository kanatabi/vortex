# APPS hub (VPS entrypoint #2), wave 1: blog SSR — reads lumen (wave 0)
# through the cluster-internal DNS in app-config (rendered from
# kv/earendil/production by the store; TLS from the certificates app, same
# wave).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: earendil
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: 'https://github.com/kanatabi/vortex.git'
    targetRevision: HEAD
    path: overlays/production/earendil
  # ESO's webhook DEFAULTS these spec fields server-side (creationPolicy,
  # deletionPolicy, template engineVersion/mergePolicy) — they never exist in
  # Git, so without this the app is PERPETUALLY OutOfSync and selfHeal would
  # thrash the ES forever. Discovered on the live walk 2026-11-10.
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.target.creationPolicy
        - .spec.target.deletionPolicy
        - .spec.target.template.engineVersion
        - .spec.target.template.mergePolicy
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: earendil
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
