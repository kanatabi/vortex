# APPS hub (VPS entrypoint #2), wave 1: admin portal (console.gofar.id; reads
# lumen (wave 0); real ACME TLS via the certificates app, same wave — go-live
# ordering in the base ingress header still binds: DNS first, real cert,
# GATE #10 before the first login).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mellon
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: 'https://github.com/kanatabi/vortex.git'
    targetRevision: HEAD
    path: overlays/production/mellon
  # ESO's webhook DEFAULTS these spec fields server-side (creationPolicy,
  # deletionPolicy, template engineVersion/mergePolicy) — they never exist in
  # Git, so without this the app is PERPETUALLY OutOfSync and selfHeal would
  # thrash the ES forever. Discovered on the live walk 2026-11-10.
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jqPathExpressions:
        - .spec.target.creationPolicy
        - .spec.target.deletionPolicy
        - .spec.target.template.engineVersion
        - .spec.target.template.mergePolicy
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: mellon
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
