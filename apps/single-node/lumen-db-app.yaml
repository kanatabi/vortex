# wave 1: Zalando V1Postgresql CR, numberOfInstances collapsed 2->1 by the
# component. Operator itself is a MANUAL prereq (runbook): pinned apply.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lumen-db
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: 'https://github.com/kanatabi/vortex.git'
    targetRevision: HEAD
    path: overlays/local/lumen-db
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: db
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
