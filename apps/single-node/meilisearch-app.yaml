# wave 1: search engine, single replica (placement collapsed by the component).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: meilisearch
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: 'https://github.com/kanatabi/vortex.git'
    targetRevision: HEAD
    path: overlays/local/meilisearch
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: search
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
