# wave 1: ClusterSecretStore bao. Its Ready condition GATES wave 2 — apps
# cannot materialize secrets before the store authenticates, which STRUCTURALLY
# forces the seed-before-apps order of the runbook (a design, not a suggestion).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-plane
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: 'https://github.com/kanatabi/vortex.git'
    targetRevision: HEAD
    path: applications/secrets-plane
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
