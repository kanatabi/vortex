# 1-node ESO: same wrapper, placement collapsed via overlays/local (valuesInline
# nodeSelectors stripped by the component — one doctrine covers chart apps too).
# Wave 0: the CRDs it installs gate everything the secrets plane touches.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: 'https://github.com/kanatabi/vortex.git'
    targetRevision: HEAD
    path: overlays/local/external-secrets
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: external-secrets
  syncPolicy:
    # ServerSideApply=true: fat chart CRDs vs the 256KiB last-applied ceiling —
    # see apps/external-secrets-app.yaml for the live-proven story.
    syncOptions:
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
