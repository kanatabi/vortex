# ESO via the same OCI Helm chart, same EXACT pin 2.15.0 — but values WITHOUT
# nodeSelectors: one node runs everything. MANUAL prereq identical: the ns must
# exist before first sync. First-sync checklist lives on the sibling prod CR
# (apps/external-secrets-app.yaml) — it applies here too (kubeVersion vs the
# cluster, helm show values audit). Observability sidecars never enter here:
# controller + webhook only, default counts.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: 'oci://ghcr.io/external-secrets/charts'
    chart: external-secrets
    targetRevision: '2.15.0'
    helm:
      releaseName: external-secrets
      values: |
        image:
          pullPolicy: IfNotPresent
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
