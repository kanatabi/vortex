# PRODUCTION hub (single VPS), wave 2: backend. Its envFrom needs lumen-secrets
# materialized by the store — Argo blocks the wave until the ClusterSecretStore
# is Ready (seeded).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lumen
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: 'https://github.com/kanatabi/vortex.git'
    targetRevision: HEAD
    path: overlays/production/lumen
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: lumen
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
