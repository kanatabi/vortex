apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: meilisearch
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/yourusername/k8s-platform-manifests.git'
    targetRevision: HEAD
    path: applications/meilisearch
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: search
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
