apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: 'https://github.com/yourusername/k8s-platform-manifests.git'
    targetRevision: HEAD
    path: applications/openbao
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
