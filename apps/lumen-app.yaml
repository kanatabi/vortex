apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lumen
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/cavadevop/k8s-platform-manifests.git'
    targetRevision: HEAD
    path: applications/lumen           # prod base; repoint at overlays/production/lumen per §5.3
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: lumen
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
