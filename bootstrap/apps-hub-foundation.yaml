# App-of-apps hub, PRODUCTION FOUNDATION entrypoint (#1 of two) — the values
# and data plane: openbao, external-secrets, secrets-plane, lumen-db,
# meilisearch, observability, lumen-admin. This is the VPS boot order made
# Git-visible:
#   1. apply THIS hub (plus the always-manual platform/argocd install)
#   2. waves inside it: OpenBao + ESO (wave 0) come up, then the `bao` store,
#      lumen-db and meilisearch (wave 1). The store stays NOT-Ready until the
#      vault is initialized and seeded — run runbook M3 (init/unseal/AppRole/
#      seed) against it here, never after the apps hub. Wave 2 (observability,
#      lumen-admin) waits for that structurally: the store's Ready condition
#      gates it, so the admin fleet cannot boot without kv/lumen/shared.
#   3. apply bootstrap/apps-hub-production.yaml (and/or
#      bootstrap/apps-hub-staging.yaml) — the application plane(s)
# Chicken-and-egg, the documented manual exception (same class as apps-hub.yaml,
# but now TWO manual applies — the two-hub split
# is precisely what makes the seed-before-apps ordering structural across the
# entrypoint, not just within one wave list). GitOps cannot bootstrap the
# cluster that hosts its own root app.
# Non-recursive sync of apps/foundation/ — the production hub (path
# apps/production/), the staging hub (path apps/staging/) and the 3-node
# blueprint hub (path apps/) never see these CRs, and vice versa: exactly one
# foundation + apps(-es) set may own a cluster.
# Source paths land on environments/foundation/* — the plane itself is
# environment-agnostic (shared Patroni, shared Meilisearch, one Grafana
# door); production's OWN plane values ride the production hub's
# environments/production/* overlays (Bao from kv/{app}/production, REAL
# ACME TLS via the certificates app) and staging's on
# environments/staging/* (kv/{app}/staging, staging hosts, same DNS-01
# issuer).
#   scale-out later:  unchanged — drop the env-tree overlays, repoint CRs at
#                     bases, relabel node-pools (see bootstrap/apps-hub.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-apps-hub-foundation
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/kanatabi/vortex.git'
    targetRevision: HEAD
    path: apps/foundation/
    directory:
      recurse: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
