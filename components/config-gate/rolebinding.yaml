# Binds the SA to the Role in the same namespace — subject deliberately has no
# namespace field (defaults to the binding's own, i.e. the syncing app's ns;
# the component stays app-agnostic).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-gate
  labels:
    app: config-gate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: config-gate
subjects:
  - kind: ServiceAccount
    name: config-gate
