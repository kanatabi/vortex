# Binds the SA to the Role in the same namespace — subject deliberately has no
# namespace field (defaults to the binding's own, i.e. the syncing app's ns;
# the component stays app-agnostic).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations:
    # The hook's own RBAC must exist BEFORE the hook runs (walked
    # 2026-11-14): as sync-phase resources the SA only came into being
    # after the gate hook needed it — the manual `kubectl create
    # serviceaccount config-gate` workaround is retired by this.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-weight: "-1"
  name: config-gate
  labels:
    app: config-gate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: config-gate
subjects:
  - kind: ServiceAccount
    name: config-gate
