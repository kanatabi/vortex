# Dedicated SA for the gate Job — not the app's own: least privilege is the
# whole read surface below, nothing else the pods can do.
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    # The hook's own RBAC must exist BEFORE the hook runs. First attempt
    # (2026-11-14) annotated `argocd.argoproj.io/hook-weight` — an
    # annotation Argo CD DOES NOT HAVE (the Helm alias `helm.sh/hook-weight`
    # maps to sync-wave; an argocd-prefixed hook-weight is silently
    # IGNORED, the object lands at wave 0, and the gate Job — a real
    # sync-wave -1 — sorted first: the 2026-11-15 production-hub apply
    # wedged on `serviceaccount "config-gate-production" not found`; the
    # 11-14 walk had been saved only by the manual kubectl-create
    # workaround). The real ordering key is `sync-wave`; -2 sorts this
    # RBAC before its Job's -1. (Actually walked 2026-11-15.)
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
  name: config-gate
  labels:
    app: config-gate
