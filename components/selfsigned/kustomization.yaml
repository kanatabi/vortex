# Component: strip ACME-shaped TLS from Ingresses for clusters without
# cert-manager (local minikube rehearsal). Traefik then serves its default
# self-signed cert (or plain http on the NodePort) — acceptable while no real
# traffic exists. NEVER include in a hub whose DNS points at the world:
# the tls block + issuer annotation are the production contract.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: Ingress
    patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: unused
        annotations:
          cert-manager.io/cluster-issuer: null
      spec:
        tls: null
