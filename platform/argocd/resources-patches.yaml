# Per-component resource fit for the 2 GB master. Totals:
#   requests ≈ 350m CPU / 832Mi mem | limits ≈ 1000m CPU / 1664Mi mem
# Requests fit alongside K3s (~500Mi) in allocatable (~1.4Gi); limits deliberately
# oversubscribe — the Phase 2 swapfile is the backstop (INFRA_ARCHITECTURE.md §1).
# Matched by name against the upstream install.yaml resources.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
spec:
  template:
    spec:
      containers:
        - name: argocd-server
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 200m, memory: 320Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  template:
    spec:
      containers:
        - name: argocd-repo-server
          resources:
            requests: { cpu: 100m, memory: 224Mi }
            limits: { cpu: 250m, memory: 448Mi }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: argocd-application-controller
spec:
  template:
    spec:
      containers:
        - name: argocd-application-controller
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 250m, memory: 448Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-redis
spec:
  template:
    spec:
      containers:
        - name: redis
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 50m, memory: 64Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-dex-server
spec:
  template:
    spec:
      containers:
        - name: dex
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 80m, memory: 128Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-notifications-controller
spec:
  template:
    spec:
      containers:
        - name: argocd-notifications-controller
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 80m, memory: 128Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-applicationset-controller
spec:
  template:
    spec:
      containers:
        - name: argocd-applicationset-controller
          resources:
            requests: { cpu: 40m, memory: 64Mi }
            limits: { cpu: 90m, memory: 128Mi }
