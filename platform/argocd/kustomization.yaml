# Argo CD's own install, pinned + fitted for the 2 GB master.
# Pin raised v2.13.2 -> v3.6.1 (2026-11-10, FIRST LIVE REHEARSAL evidence):
# 2.13.2 cannot render the OCI Helm chart app (builds `helm pull --repo oci://...`
# -> helm "object required"), and ESO publishes 2.x charts OCI-only. Deliberate
# bump, overlay stays version-agnostic (labelSelector pinning + per-name resources).
# Bootstrap manually once (Phase 6): kubectl apply -k platform/argocd/
# Upstream is pinned to an exact release — never let a self-hosting GitOps tool
# auto-update itself from a floating tag.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Upstream install.yaml leaves most resources namespace-less (it assumes `kubectl -n`);
# this stamps everything onto the Namespace object below.
namespace: argocd

resources:
  # The upstream install.yaml carries namespace: argocd on every resource but does
  # NOT define the Namespace object itself — without this, `kubectl apply -k` fails
  # with `namespaces "argocd" not found`.
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.6.1/manifests/install.yaml

patches:
  # kustomize helmCharts support: the repo-server needs --enable-helm or
  # applications/external-secrets renders nothing (walk-proven 2026-11-10).
  # Inline body: builtin kustomize's target+path entry combo fails to parse here;
  # the bare-file-with-own-target trick is invalid in a patches: path: entry too
  # (workspace lore) — inline is unambiguous.
  - target:
      kind: ConfigMap
      name: argocd-cm
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
      data:
        kustomize.buildOptions: --enable-helm

  # Same JSON6902 body, applied to every Argo Deployment and StatefulSet via
  # label selector — new components in future releases are covered automatically.
  - path: pinning-patch.yaml
    target:
      kind: Deployment
      labelSelector: app.kubernetes.io/part-of=argocd
  - path: pinning-patch.yaml
    target:
      kind: StatefulSet
      labelSelector: app.kubernetes.io/part-of=argocd
  # Per-component requests/limits (multi-document strategic-merge patch).
  - path: resources-patches.yaml
