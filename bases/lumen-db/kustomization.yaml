# lumen-db — the Patroni PostgreSQL cluster USED BY LUMEN (the backend).
# Zalando operator CR in namespace `db`; Services: lumen-pg-postgres
# (read/write) and lumen-pg-repl (read-only). ONE shared cluster, THREE
# logical databases + owner users — lumen_admin / lumen_staging /
# lumen_production, consumed by the foundation lumen-admin and the two cms
# tenants respectively; the per-env split is the LUMEN_DB_URL behind each
# environment's Bao path (INFRA doc §5). Topology Option A (2 instances/2
# workers); Option C (3 instances + synchronous_mode) is a documented
# one-PR change, Phase 4.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - postgresql.yaml
