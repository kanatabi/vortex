# mellon — admin portal base. Runtime env only (PORT + API_BASE); env overlays
# swap the inline block for the ESO-rendered app-config ConfigMap (earendil's
# exact pattern). Bao paths: kv/mellon/{env}.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mellon

resources:
- serviceaccount.yaml
- namespace.yaml
- deployment.yaml
- service.yaml
# NO ingress HERE (env-model ingress retirement): public surfaces are env
# decisions too — each environments/<env>/mellon overlay authors its own
# ingress.yaml with hosts/backend/TLS stated final (nameSuffix rewrites
# metadata.name only). The 3-node blueprint hub therefore renders no
# Ingress — shape-only by design, like pins and ESO.
# NO images: stanza HERE — the base is SHAPE, versions are ENV decisions
# (Phase-11; fixture-proven kustomize v5.8.1 semantics: an inner base
# transformation wins over every outer overlay re-statement, so a base pin
# would silently override the env trees and leak across envs). The env
# overlays (environments/{staging,production}/mellon) are the ONLY pin
# homes; base standalone keeps `image: mellon` as the honest placeholder.
