# Provisioned Grafana dashboards — the same file-provisioning pattern as the
# alerting rules (ConfigMap -> /etc/grafana/provisioning/dashboards). The
# provider picks up every *.json sibling; dashboards land read-only (editable
# in the UI but reverted on restart) — the Learning folder (ch.10 §6) is where
# scratch work lives. Queries use ONLY series the estate actually exports
# (walked 2026-11-14: cAdvisor per-pod, /metrics/resource node aggregates,
# kubelet volume stats — datasource uid victoria-metrics, the provisioned
# default; series carry env= where the omicron/env pod label is stamped).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: observability
  labels:
    app: grafana
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: estate
        orgId: 1
        folder: Estate
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/provisioning/dashboards
          foldersFromFilesStructure: false
  estate-overview.json: |
    {
      "uid": "estate-overview",
      "title": "Estate overview — nodes, pods, volumes",
      "tags": ["omicron", "estate"],
      "timezone": "browser",
      "schemaVersion": 39,
      "editable": true,
      "refresh": "30s",
      "time": { "from": "now-3h", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "Node CPU (cores in use)",
          "datasource": { "type": "prometheus", "uid": "victoria-metrics" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "none" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "sum by (node) (rate(node_cpu_usage_seconds_total[5m]))", "legendFormat": "{{node}}" }
          ]
        },
        {
          "id": 2, "type": "timeseries", "title": "Node memory working set",
          "datasource": { "type": "prometheus", "uid": "victoria-metrics" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "node_memory_working_set_bytes", "legendFormat": "{{node}}" }
          ]
        },
        {
          "id": 3, "type": "timeseries", "title": "Pod CPU — top 10",
          "datasource": { "type": "prometheus", "uid": "victoria-metrics" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "none" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "topk(10, sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{pod!=\"\"}[5m])))", "legendFormat": "{{namespace}}/{{pod}}" }
          ]
        },
        {
          "id": 4, "type": "timeseries", "title": "Pod memory working set — top 10",
          "datasource": { "type": "prometheus", "uid": "victoria-metrics" },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "topk(10, sum by (namespace, pod) (container_memory_working_set_bytes{pod!=\"\"}))", "legendFormat": "{{namespace}}/{{pod}}" }
          ]
        },
        {
          "id": 5, "type": "timeseries", "title": "PVC usage (% of capacity)",
          "datasource": { "type": "prometheus", "uid": "victoria-metrics" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 17 },
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100 }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "100 * kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes", "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}" }
          ]
        },
        {
          "id": 6, "type": "timeseries", "title": "Pod disk writes — top 10",
          "datasource": { "type": "prometheus", "uid": "victoria-metrics" },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 17 },
          "fieldConfig": { "defaults": { "unit": "Bps" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "topk(10, sum by (namespace, pod) (rate(container_fs_writes_bytes_total{pod!=\"\"}[5m])))", "legendFormat": "{{namespace}}/{{pod}}" }
          ]
        }
      ]
    }
