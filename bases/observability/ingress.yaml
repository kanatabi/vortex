# anor.gofar.id — the dashboard door (surface #2's sibling: authenticated via
# Cloudflare Access OIDC + Grafana RBAC, so exposing the UI is a decision
# already made, not a convenience). Deliberately NO cert-manager.io/
# cluster-issuer annotation: the explicit Certificate anor-gofar-id
# (bases/certificates) renders tls-anor, and the ingress-shim would
# only shadow-issue a duplicate Certificate against the same hostnames.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: observability
  annotations:
    # LAST WAVE + SKIP-HEALTH-CHECK, deliberately: on k3d (no load-balancer
    # assignment) an Ingress is PERMANENTLY Degraded (empty
    # status.loadBalancer — walked 2026-11-14), and Argo's sync op waits for
    # the LAST wave's health before completing — so an Ingress in ANY wave
    # holds every sync operation open forever and wedges the whole app
    # (4x walked). skip-health-check exempts it from the wait; the door is
    # still created and works fully where a real LB exists (the VPS, ch. 07).
    argocd.argoproj.io/skip-health-check: "true"
    argocd.argoproj.io/sync-wave: "3"
spec:
  ingressClassName: traefik
  rules:
    - host: anor.gofar.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  name: http
  tls:
    - secretName: tls-anor
      hosts:
        - anor.gofar.id
