# anor.gofar.id — the dashboard door (surface #2's sibling: authenticated via
# Cloudflare Access OIDC + Grafana RBAC, so exposing the UI is a decision
# already made, not a convenience). Deliberately NO cert-manager.io/
# cluster-issuer annotation: the explicit Certificate anor-gofar-id
# (bases/certificates) renders tls-anor, and the ingress-shim would
# only shadow-issue a duplicate Certificate against the same hostnames.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: observability
  annotations:
    # LAST WAVE, deliberately: on k3d (no load-balancer assignment) an
    # Ingress is PERMANENTLY Degraded (empty status.loadBalancer — walked
    # 2026-11-14), and a wave-0 Ingress holds every sync operation open
    # forever ("waiting for healthy state"), wedging the whole app. In the
    # last wave nothing waits behind it; the door itself wakes on the real
    # VPS in ch. 07.
    argocd.argoproj.io/sync-wave: "3"
spec:
  ingressClassName: traefik
  rules:
    - host: anor.gofar.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  name: http
  tls:
    - secretName: tls-anor
      hosts:
        - anor.gofar.id
