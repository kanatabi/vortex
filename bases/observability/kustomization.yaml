apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

resources:
  - serviceaccount.yaml
  - namespace.yaml
  - victoria-metrics.yaml
  - loki.yaml
  - alloy
  - grafana.yaml
  # Grafana's config feeds (kv/grafana/production via the `bao` store) + the
  # anor.gofar.id door. NOTE for the ESO-free-bases doctrine (README): this dir
  # is the one deliberate exception — observability has no dev/staging env axis,
  # every hub that syncs it also syncs ESO + the store (waves 0/1), and the
  # feeds are optional:true so a store without kv/grafana/production degrades
  # to Grafana defaults, never a failed sync.
  - externalsecret.yaml
  - ingress.yaml
  # Provisioned dashboards (provider + the Estate overview) — explicit listing
  # is load-bearing: kustomize renders ONLY the files named here, and an
  # unlisted new file silently vanishes from every render (walked 2026-11-14:
  # the deployment referenced grafana-dashboards before this entry existed —
  # FailedMount loop, sync "waiting for healthy state of Deployment/grafana").
  - dashboards.yaml
