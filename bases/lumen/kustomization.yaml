# lumen — the blog BACKEND API (source repo: lumen; one binary, roles
# server|worker|all). http-server pods serve the API that earendil + mellon
# reach via internal DNS (NO public ingress — access matrix §2); worker pods run
# background jobs independently (1 replica, own scheduling, never behind the
# Service). Reads lumen-secrets (ESO-rendered from OpenBao in env overlays) +
# lumen-bao-credentials (§5.6 bootstrap family); /metrics on the unrouted admin
# :9090 per the Alloy scrape contract.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lumen

resources:
- serviceaccount.yaml
- namespace.yaml
- http-server-deployment.yaml
- worker-deployment.yaml
- service.yaml
- migrate-job.yaml
# NO images: stanza HERE — the base is SHAPE, versions are ENV decisions
# (Phase-11; fixture-proven kustomize v5.8.1 semantics: an inner base
# transformation wins over every outer overlay re-statement, so a base pin
# would silently override the env trees and leak across envs — fatal for
# the three-fleet model where foundation/staging/production lumen pins
# diverge). The env overlays (environments/*/lumen*) are the ONLY pin
# homes; the bump tooling's same-env lockstep is exactly right; base
# standalone keeps `image: lumen` as the honest placeholder.
