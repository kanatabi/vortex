# lumen runs ONE codebase as two processes: http-server serves the API that earendil
# calls (internal DNS only); this deployment runs the same image as background WORKERS
# (jobs/queues). Independent by design: 1 replica, own scheduling, never behind the
# Service. Shares the image + lumen-secrets; NO HTTP listener — probes were
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumen-worker
  annotations:
    argocd.argoproj.io/sync-wave: "2"   # after migrate (wave 1) — never boots dark
  namespace: lumen
  labels:
    app: lumen-worker
    app.kubernetes.io/name: lumen
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lumen-worker
  template:
    metadata:
      labels:
        app: lumen-worker
        app.kubernetes.io/name: lumen
        app.kubernetes.io/component: worker
      # Observability contract (architecture doc Phase 5): Alloy scrapes annotated pods.
      # /metrics is served on an ADMIN port (9090) that no Service routes — unreachable
      # from outside the pod by design.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      # NOTE: if GHCR packages are private, create an imagePullSecret in this namespace
      # and add: imagePullSecrets: [{name: ghcr-pull}]
      affinity:
        # Keep pods off the 2 GB master (node-pool=platform). NO podAntiAffinity:
        # single replica, scheduled independently of http-server on purpose.
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-pool
                    operator: NotIn
                    values: ['platform']
      enableServiceLinks: false   # walk lesson 2026-11-10: kubelet service-links
      #                   injected LUMEN_PORT=tcp://..., viper read it as the port
      containers:
        - name: lumen-worker
          image: lumen
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # Secrets (DB creds, Meilisearch key) arrive via lumen-secrets: rendered
          # in-cluster by ESO from OpenBao in production overlays (INFRA doc §5);
          # optional in k3d/dev.
          # queue consumer only — the split-role counterpart of the http-server
          # (v3.0.0: the image CMD 'all' refuses a split LUMEN_ROLE)
          args: ["worker"]
          envFrom:
            - secretRef:
                name: lumen-secrets
                optional: true
            # relay creds land here too (worker role keeps the same env contract)
            - secretRef:
                name: lumen-bao-credentials
          # NO http probes: the worker role runs NO HTTP server (Short says
          # so) — port 8080 is a declaration of intent, not a listener. Death is
          # structural: queue start failure exits the process, kubelet restarts.
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
