# Dedicated ServiceAccount for the app's pods (owner ruling 2026-11-14:
# every app gets a SA CR created automatically — whether the workloads
# USE it is a later decision; least privilege can be split per-workload
# then). The tree's nameSuffix env-suffixes this name in co-tenant trees.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lumen
  labels:
    app: lumen
