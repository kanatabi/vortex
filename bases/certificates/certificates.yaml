# The three public certificates of the estate. Each lives in the namespace of
# the workload whose Ingress consumes it (cert-manager namespaced Secret ->
# same-namespace Ingress tls.secretName). LE rotation windows: 90d issued /
# renew at 60d (renewBefore 30d) — standard, generous for a blog-scale ACME
# account. The cert expiry <21d alert (observability) is the safety net if
# renewal ever silently stops.
#
# Surface map (INFRA §2 amendment 2026-11-08 + feat/environments-staging
# hosts contract — these are ALL the doors):
#   gofar.id + www        -> earendil production   (surface #1, content)
#   staging.gofar.id      -> earendil staging      (www is production-only;
#                                                   staging never wears it)
#   console.gofar.id      -> mellon production     (surface #2, admin portal)
#   staging-console       -> mellon staging
#   anor.gofar.id         -> grafana               (dashboard door)
# DNS-01 works on every cluster, so staging certificates ride the SAME
# ClusterIssuer (components/selfsigned retired with the rehearsal tree).
# NOTE for the staging overlays: kustomize nameSuffix does NOT reach this
# dir (the certificates app is synced un-suffixed from bases/);
# staging identity here lives in the object names + the suffixed Secret
# names the staging Ingresses' tls blocks reference.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: gofar-id
  namespace: earendil
spec:
  secretName: tls-gofar
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: gofar.id
  dnsNames:
    - gofar.id
    - www.gofar.id
  duration: 2160h0m0s      # 90d
  renewBefore: 720h0m0s    # 30d
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: console-gofar-id
  namespace: mellon
spec:
  secretName: tls-console
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: console.gofar.id
  dnsNames:
    - console.gofar.id
  duration: 2160h0m0s      # 90d
  renewBefore: 720h0m0s    # 30d
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: anor-gofar-id
  namespace: observability
spec:
  secretName: tls-anor
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: anor.gofar.id
  dnsNames:
    - anor.gofar.id
  duration: 2160h0m0s      # 90d
  renewBefore: 720h0m0s    # 30d
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: staging-gofar-id
  namespace: earendil
spec:
  secretName: tls-gofar-staging    # referenced verbatim by the staging
  #                     Ingress (environments/staging/earendil patches spec.tls)
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: staging.gofar.id
  dnsNames:
    - staging.gofar.id
  duration: 2160h0m0s      # 90d
  renewBefore: 720h0m0s    # 30d
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: staging-console-gofar-id
  namespace: mellon
spec:
  secretName: tls-console-staging  # referenced verbatim by the staging portal
  #                     Ingress (environments/staging/mellon patches spec.tls)
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: staging-console.gofar.id
  dnsNames:
    - staging-console.gofar.id
  duration: 2160h0m0s      # 90d
  renewBefore: 720h0m0s    # 30d
