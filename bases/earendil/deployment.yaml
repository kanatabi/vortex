apiVersion: apps/v1
kind: Deployment
metadata:
  name: earendil-web-server
  namespace: earendil
  annotations:
    argocd.argoproj.io/sync-wave: "2"   # after the ES (wave 0) renders — never boots dark
  labels:
    app: earendil-web-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: earendil-web-server
  template:
    metadata:
      labels:
        app: earendil-web-server
      # Observability contract (architecture doc Phase 5): Alloy scrapes
      # annotated pods — no sidecars, no public API. The Node apps serve
      # /metrics on an UNROUTED listener (EARENDIL_/MELLON_METRICS_PORT,
      # default 9090, one process, two listeners) — landed 2026-11-15
      # (earendil 7b872ad / mellon c86c9cd).
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      # NOTE: if GHCR packages are private, create an imagePullSecret in this namespace
      # and add: imagePullSecrets: [{name: ghcr-pull}]
      affinity:
        # SSR pods are lightweight (Node renders HTML) — keep them off the 2 GB master
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-pool
                    operator: NotIn
                    values: ['platform']
        # One instance per worker node
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: earendil-web-server
              topologyKey: kubernetes.io/hostname
      enableServiceLinks: false   # walk lesson 2026-11-10: kubelet service-links
      #                   injected LUMEN_PORT=tcp://..., viper read it as the port
      containers:
        - name: earendil-web-server
          image: earendil
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          # ZERO config literals here (owner ruling 2026-11-11): every env value
          # arrives as app-config — ESO-rendered from Bao in every real environment
          # (environments/*/earendil/externalsecret.yaml). optional:true keeps the bare
          # k3d shape honest: no Bao -> the app's own runtime fallbacks answer
          # (API_BASE unset = dev default) instead of a ConfigMapError.
          envFrom:
            - configMapRef: { name: app-config, optional: true }
          # /healthz: the STATIC health door — a probe must never render a page
# (the old `path: /` probes SSR-rendered the homepage and fired lumen
# calls every 20s: the fake /api/* traffic the metrics exposed).
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 30
            periodSeconds: 60
          livenessProbe:
            # same ordering constraint as the readiness probe above
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 300m, memory: 384Mi }
