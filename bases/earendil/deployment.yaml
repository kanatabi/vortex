apiVersion: apps/v1
kind: Deployment
metadata:
  name: earendil-web-server
  namespace: earendil
  labels:
    app: earendil-web-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: earendil-web-server
  template:
    metadata:
      labels:
        app: earendil-web-server
    spec:
      # NOTE: if GHCR packages are private, create an imagePullSecret in this namespace
      # and add: imagePullSecrets: [{name: ghcr-pull}]
      affinity:
        # SSR pods are lightweight (Node renders HTML) — keep them off the 2 GB master
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-pool
                    operator: NotIn
                    values: ['platform']
        # One instance per worker node
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: earendil-web-server
              topologyKey: kubernetes.io/hostname
      enableServiceLinks: false   # walk lesson 2026-11-10: kubelet service-links
      #                   injected LUMEN_PORT=tcp://..., viper read it as the port
      containers:
        - name: earendil-web-server
          image: earendil
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          # ZERO config literals here (owner ruling 2026-11-11): every env value
          # arrives as app-config — ESO-rendered from Bao in every real environment
          # (environments/*/earendil/externalsecret.yaml). optional:true keeps the bare
          # k3d shape honest: no Bao -> the app's own runtime fallbacks answer
          # (API_BASE unset = dev default) instead of a ConfigMapError.
          envFrom:
            - configMapRef: { name: app-config, optional: true }
          # No dedicated health route; the root page renders 200 in SSR.
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 30
            periodSeconds: 60
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 300m, memory: 384Mi }
