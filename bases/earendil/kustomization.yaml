# earendil — the blog FRONTEND. SvelteKit 3 SSR app (adapter-node, source repo:
# earendil) serving https://gofar.id (ainurrofiq.com 301s in). Also hosts the
# same-origin /api proxy that carries the browser's only client-side call to the
# cluster-internal backend (lumen). No VITE_* build-time env — runtime
# API_BASE/PUBLIC_API_BASE only (ORIGIN: no consumer, dropped 2026-11-10), so
# one image runs in every environment (see environments/).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: earendil

resources:
- serviceaccount.yaml
- namespace.yaml
- deployment.yaml
- service.yaml
# NO ingress HERE (env-model ingress retirement): public surfaces are env
# decisions too — each environments/<env>/earendil overlay authors its own
# ingress.yaml with hosts/backend/TLS stated final (nameSuffix rewrites
# metadata.name only). The 3-node blueprint hub therefore renders no
# Ingress — shape-only by design, like pins and ESO.
# NO images: stanza HERE — the base is SHAPE, versions are ENV decisions
# (Phase-11). Kustomize v5.8.1 fact (fixture-proven, convergence 2026-11-13):
# an inner (base) image transformation rewrites the image name BEFORE the
# outer (overlay) one matches, so a base stanza SILENTLY WINS over every
# env overlay's re-statement — the overlay pins would be decorative and a
# base edit would leak into every env at once. The env overlays
# (environments/{foundation,staging,production}/<app>) are therefore the
# ONLY pin homes; the bump tooling's same-env lockstep is exactly right.
# Base standalone renders keep `image: earendil` as the honest placeholder
# (nothing deploys a base — the hubs point at env trees only).
