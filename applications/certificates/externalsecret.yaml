# Cloudflare API token for the ACME dns01 solver. Values live in Bao
# (kv/data/cert-manager/production, property CF_API_TOKEN) exactly like every
# other secret in the estate; this CR renders it into Secret cf-token in the
# cert-manager namespace, where the ClusterIssuer's solver reads it.
# The token is scoped DNS-Edit-only (Zone.DNS Edit on gofar.id and nothing
# else) — the runbook owns the how of minting it; Git owns only the shape.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cf-dns-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bao
    kind: ClusterSecretStore
  target:
    name: cf-token
  data:
    - secretKey: api-token
      remoteRef: { key: cert-manager/production, property: CF_API_TOKEN }
