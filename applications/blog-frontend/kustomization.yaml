apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: blog-frontend

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

images:
  # CI updates newTag via `kustomize edit set image blog-frontend=<ghcr image>:sha-<short>`
  - name: blog-frontend
    newName: ghcr.io/yourusername/sv-fzr
    newTag: sha-local
