apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-frontend
  namespace: blog-frontend
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blog-frontend
                port:
                  name: http
  tls:
    - secretName: blog-frontend-tls
      hosts:
        - yourdomain.com
