apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lumen

resources:
  - namespace.yaml
  - http-server-deployment.yaml
  - worker-deployment.yaml
  - service.yaml

images:
  # CI updates newTag via `kustomize edit set image lumen=<ghcr image>:sha-<short>`
  - name: lumen
    newName: ghcr.io/cavadevop/fzr-backend
    newTag: sha-local
