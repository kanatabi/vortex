apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumen-http-server
  namespace: lumen
  labels:
    app: lumen-http-server
    app.kubernetes.io/name: lumen
    app.kubernetes.io/component: http-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lumen-http-server
  template:
    metadata:
      labels:
        app: lumen-http-server
        app.kubernetes.io/name: lumen
        app.kubernetes.io/component: http-server
      # Observability contract (architecture doc Phase 5): Alloy scrapes annotated pods.
      # /metrics is served on an ADMIN port (9090) that no Service routes — unreachable
      # from outside the pod by design.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      # NOTE: if GHCR packages are private, create an imagePullSecret in this namespace
      # and add: imagePullSecrets: [{name: ghcr-pull}]
      affinity:
        # Keep pods off the 2 GB master (node-pool=platform)
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-pool
                    operator: NotIn
                    values: ['platform']
        # The two http-server instances must never share a worker node
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: lumen-http-server
              topologyKey: kubernetes.io/hostname
      containers:
        - name: lumen-http-server
          image: lumen
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # Secrets (DB creds, Meilisearch key) arrive via lumen-secrets: rendered
          # in-cluster by ESO from OpenBao in production overlays (INFRA doc §5);
          # optional in k3d/dev.
          envFrom:
            - secretRef:
                name: lumen-secrets
                optional: true
            # §5.6 bootstrap family: the portal relay's Bao AppRole creds
            # (LUMEN_BAO_ADDR/ROLE_ID/SECRET_ID). Deliberately NOT an ExternalSecret
            # (bootstrap paradox) and deliberately optional:true — k3d/local without
            # a relay just runs with Bao paths dark, exactly as before.
            - secretRef:
                name: lumen-bao-credentials
                optional: true
          readinessProbe:
            httpGet: { path: /ping, port: http }
            initialDelaySeconds: 30
            periodSeconds: 60
          livenessProbe:
            httpGet: { path: /ping, port: http }
            initialDelaySeconds: 30
            periodSeconds: 60
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
