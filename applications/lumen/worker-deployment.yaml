# lumen runs ONE codebase as two processes: http-server serves the API that earendil
# calls (internal DNS only); this deployment runs the same image as background WORKERS
# (jobs/queues). Independent by design: 1 replica, own scheduling, never behind the
# Service. Shares the image + lumen-secrets; runs its own /ping + admin :9090.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumen-worker
  namespace: lumen
  labels:
    app: lumen-worker
    app.kubernetes.io/name: lumen
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lumen-worker
  template:
    metadata:
      labels:
        app: lumen-worker
        app.kubernetes.io/name: lumen
        app.kubernetes.io/component: worker
      # Observability contract (architecture doc Phase 5): Alloy scrapes annotated pods.
      # /metrics is served on an ADMIN port (9090) that no Service routes — unreachable
      # from outside the pod by design.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      # NOTE: if GHCR packages are private, create an imagePullSecret in this namespace
      # and add: imagePullSecrets: [{name: ghcr-pull}]
      affinity:
        # Keep pods off the 2 GB master (node-pool=platform). NO podAntiAffinity:
        # single replica, scheduled independently of http-server on purpose.
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-pool
                    operator: NotIn
                    values: ['platform']
      containers:
        - name: lumen-worker
          image: lumen
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # Secrets (DB creds, Meilisearch key) arrive via lumen-secrets: rendered
          # in-cluster by ESO from OpenBao in production overlays (INFRA doc §5);
          # optional in k3d/dev.
          envFrom:
            - secretRef:
                name: lumen-secrets
                optional: true
          readinessProbe:
            httpGet: { path: /ping, port: http }
            initialDelaySeconds: 30
            periodSeconds: 60
          livenessProbe:
            httpGet: { path: /ping, port: http }
            initialDelaySeconds: 30
            periodSeconds: 60
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
