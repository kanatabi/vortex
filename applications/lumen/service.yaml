apiVersion: v1
kind: Service
metadata:
  name: lumen
  namespace: lumen
  # CLUSTER-INTERNAL ONLY by design: the SvelteKit SSR pods call this via service DNS,
  # and the browser's one client-side call (search suggest) is proxied same-origin
  # through the frontend. Do not add an Ingress here without revisiting §2 of
  # INFRA_ARCHITECTURE.md.
spec:
  type: ClusterIP
  # http-server pods ONLY — the worker runs the same image but must never receive
  # API traffic. (The old `app: lumen` selector matched zero pods.)
  selector:
    app: lumen-http-server
  ports:
    - name: http
      port: 80
      targetPort: http
