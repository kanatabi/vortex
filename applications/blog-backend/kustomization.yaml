apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: blog-backend

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml

images:
  # CI updates newTag via `kustomize edit set image blog-backend=<ghcr image>:sha-<short>`
  - name: blog-backend
    newName: ghcr.io/yourusername/fzr-blog-api
    newTag: sha-local
