# ClusterSecretStore — how every ExternalSecret reaches OpenBao (§5).
# Prereqs (manual bootstrap, §5.6): kv-v2 mount at path "kv", approle role "eso" whose
# role-id/secret-id are seeded into Secret `external-secrets/bao-approle-credentials`.
# Sync-order note: this app self-heals via Argo retries if ESO CRDs aren't up yet —
# the external-secrets chart Application (wave earlier) installs them; expect this app
# to error-and-retry for a minute on a brand-new cluster, then go green.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bao
spec:
  provider:
    vault:
      server: http://bao.secrets.svc.cluster.local:8200
      path: kv                      # KV-v2 mount name; ExternalSecret keys are relative:
                                    #   "prod/earendil" -> kv/data/prod/earendil
      version: V2
      auth:
        appRole:
          path: approle
          roleId: REPLACE_AT_BOOTSTRAP   # not secret; from `bao read auth/approle/role/eso/role-id`
          secretRef:
            name: bao-approle-credentials
            key: secret-id
            namespace: external-secrets
