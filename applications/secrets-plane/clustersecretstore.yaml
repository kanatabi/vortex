# ClusterSecretStore — how every ExternalSecret reaches OpenBao (§5).
# Prereqs (manual bootstrap, §5.6): kv-v2 mount at path "kv", approle role "eso";
# BOTH role-id and secret-id arrive via the Secret `external-secrets/bao-approle-credentials`
# (two keys: role-id + secret-id). Deliberately NO roleId literal in Git (the old
# REPLACE_AT_BOOTSTRAP placeholder was cluster-specific — impossible to honest when
# one repo fronts both the local rehearsal and the VPS; each cluster's store would
# need a different value in the same file). A Secret applied at bootstrap is the
# one seeded object (§5.6); everything downstream stays templated.
# Sync-order note: this app self-heals via Argo retries if ESO CRDs aren't up yet —
# the external-secrets chart Application (wave earlier) installs them; expect this app
# to error-and-retry for a minute on a brand-new cluster, then go green.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bao
spec:
  provider:
    vault:
      server: http://bao.secrets.svc.cluster.local:8200
      path: kv                      # KV-v2 mount name; ExternalSecret keys are relative:
                                    #   "earendil/production" -> kv/data/earendil/production
                                    #   (kv/{app}/{env} — doctrine §5.4)
      version: v2   # lowercase — ESO 2.15 CRD enums are strict; "V2" was rejected by
                    # the apiserver on the first-ever deploy (live walk 2026-11-10)
      auth:
        appRole:
          path: approle
          secretRef:
            name: bao-approle-credentials
            key: secret-id
            namespace: external-secrets
          roleRef:
            name: bao-approle-credentials
            key: role-id
            namespace: external-secrets
