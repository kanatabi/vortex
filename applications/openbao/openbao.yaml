# OpenBao — the values store for config & secrets (architecture doc §5).
# BOOTSTRAP EXCEPTION: after first sync, init/unseal/AppRole setup is done MANUALLY
# once (§5.6):
#   kubectl -n secrets exec deploy/openbao -- bao operator init -key-shares=1 -key-threshold=1
#   # -> store root token + the single unseal key OFFLINE (§5.6); then:
#   kubectl -n secrets exec deploy/openbao -- bao operator unseal <KEY>
#   kubectl -n secrets exec deploy/openbao -- bao login token <ROOT>
#   kubectl -n secrets exec deploy/openbao -- bao secrets enable -path=kv kv-v2
#   kubectl -n secrets exec deploy/openbao -- bao auth enable approle
#   kubectl -n secrets exec deploy/openbao -- bao policy write portal ...   # §5.5 policy
#   kubectl -n secrets exec deploy/openbao -- bao write auth/approle/role/eso token_ttl=1h policies=eso
#   # capture role-id + secret-id -> kubectl -n external-secrets create secret generic bao-approle-credentials
# After a pod restart Bao comes back SEALED; unseal with:
#   kubectl -n secrets exec deploy/openbao -- bao operator unseal <KEY>
# (automatable later via a Job reading a Secret — deliberately not seeded from Git).
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-config
data:
  server.hcl: |
    ui = true
    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = 1            # cluster-internal; mesh/admin via port-forward (§2)
    }
    storage "file" {
      path = "/data"
    }
    api_addr = "http://bao.secrets.svc.cluster.local:8200"
    cluster_addr = "http://bao.secrets.svc.cluster.local:8201"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openbao
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao
  labels: { app: openbao }
spec:
  replicas: 1
  selector:
    matchLabels: { app: openbao }
  strategy: { type: Recreate }          # single-writer file storage
  template:
    metadata:
      labels: { app: openbao }
    spec:
      nodeSelector: { node-pool: edge }
      containers:
        - name: openbao
          image: openbao/openbao:2.1.1
          command: ["bao", "server", "-config=/config/server.hcl"]
          ports:
            - { containerPort: 8200, name: http }
            - { containerPort: 8201, name: cluster }
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: data, mountPath: /data }
          # `bao status` answers even while sealed — liveness must NOT treat sealed as dead,
          # but readiness-ish is manual at blog scale (single replica, always-up target).
          livenessProbe:
            exec: { command: ["bao", "status"] }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 160Mi }
            limits: { cpu: 300m, memory: 320Mi }
      volumes:
        - name: config
          configMap: { name: openbao-config }
        - name: data
          persistentVolumeClaim: { claimName: openbao }
---
apiVersion: v1
kind: Service
metadata: { name: bao }
spec:
  type: ClusterIP
  selector: { app: openbao }
  ports:
    - { name: http, port: 8200, targetPort: http }
    - { name: cluster, port: 8201, targetPort: cluster }
