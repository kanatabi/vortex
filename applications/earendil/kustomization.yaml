apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: earendil

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

images:
  # CI updates newTag via `kustomize edit set image earendil=<ghcr image>:sha-<short>`
  - name: earendil
    newName: ghcr.io/cavadevop/earendil
    newTag: sha-local
