apiVersion: apps/v1
kind: Deployment
metadata:
  name: earendil-web-server
  namespace: earendil
  labels:
    app: earendil-web-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: earendil-web-server
  template:
    metadata:
      labels:
        app: earendil-web-server
    spec:
      # NOTE: if GHCR packages are private, create an imagePullSecret in this namespace
      # and add: imagePullSecrets: [{name: ghcr-pull}]
      affinity:
        # SSR pods are lightweight (Node renders HTML) — keep them off the 2 GB master
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-pool
                    operator: NotIn
                    values: ['platform']
        # One instance per worker node
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: earendil-web-server
              topologyKey: kubernetes.io/hostname
      containers:
        - name: earendil-web-server
          image: earendil-web-server
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            # adapter-node listen port + canonical origin for SSR redirects/CSP
            - name: PORT
              value: "3000"
            - name: ORIGIN
              value: "https://ainurrofiq.com"
            # Server-side: internal service DNS (API has no public ingress)
            - name: API_BASE
              value: "http://lumen-http-server.lumen.svc.cluster.local"
            # Browser-side: "/" routes the search-suggest fetch to the SSR pod's
            # same-origin proxy (src/routes/api/[...path]/+server.ts)
            - name: PUBLIC_API_BASE
              value: "/"
          # No dedicated health route; the root page renders 200 in SSR.
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 30
            periodSeconds: 60
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 300m, memory: 384Mi }
