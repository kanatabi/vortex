apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: earendil-web-server
  namespace: earendil
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: www.gofar.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: earendil-web-server
                port:
                  name: http
    - host: gofar.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: earendil-web-server
                port:
                  name: http
  tls:
    - secretName: earendil-web-server-tls
      hosts:
        - www.gofar.id
        - gofar.id
