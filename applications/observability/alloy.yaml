# Grafana Alloy — OTel-native collector as a per-node DaemonSet (NOT per-app sidecars).
# Runs on worker pools only; the 2 GB master is covered remotely (kubelet scrape)
# and via rsyslog forwarding (Phase 5 of the architecture doc). StatsD listener is
# included but commented: the door stays free if a statsd-only component ever joins.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, services, endpoints, pods, namespaces, configmaps]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: alloy }
subjects: [{ kind: ServiceAccount, name: alloy, namespace: observability }]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
data:
  config.alloy: |
    // ================= sinks =================
    prometheus.remote_write "vm" {
      endpoint { url = "http://victoria-metrics.observability.svc.cluster.local:8428/api/v1/write" }
    }

    loki.write "loki" {
      endpoint { url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push" }
    }

    // ================= pod logs: tail kubelet log files on this node =================
    local.file_match "pod_logs" {
      path_targets = [{
        __path__  = "/var/log/pods/*/*/*.log",
        instance  = env("HOSTNAME"),
        job       = "kubelet-pods",
      }]
    }
    loki.source.file "pod_logs" {
      targets    = local.file_match.pod_logs.targets
      forward_to = [loki.write.loki.receiver]
    }

    // ================= master host logs: rsyslog forwarding lands here =================
    // master's /etc/rsyslog.d/50-omk3s.conf ships journald+daemon logs to :5514/udp
    loki.source.syslog "master" {
      listener   { protocol = "udp" address = "0.0.0.0:5514" }
      forward_to = [loki.write.loki.receiver]
    }

    // ================= metrics: kubelet + cAdvisor (covers master too) =================
    // Scrape every node's kubelet over its InternalIP:10250 with the pod's SA bearer;
    // k3s certs are self-signed. This is how the agentless master gets full coverage.
    discovery.kubernetes "nodes" { role = "node" }
    discovery.relabel "kubelet" {
      targets = discovery.kubernetes.nodes.targets
      rule {
        action        = "replace"
        source_labels = ["__meta_kubernetes_node_address_InternalIP"]
        regex         = "(.+)"
        target_label  = "__address__"
        replacement   = "${1}:10250"
      }
      rule { action = "replace", target_label = "node", source_labels = ["__meta_kubernetes_node_name"] }
    }
    prometheus.scrape "kubelet" {
      targets       = discovery.relabel.kubelet.output
      scheme        = "https"
      metrics_path  = "/metrics"
      authorization = { type = "Bearer", credentials_file = "/var/run/secrets/kubernetes.io/serviceaccount/token" }
      tls_config    = { insecure_skip_verify = true }
      forward_to    = [prometheus.remote_write.vm.receiver]
      job_name      = "kubelet"
    }
    prometheus.scrape "cadvisor" {
      targets       = discovery.relabel.kubelet.output
      scheme        = "https"
      metrics_path  = "/metrics/cadvisor"
      authorization = { type = "Bearer", credentials_file = "/var/run/secrets/kubernetes.io/serviceaccount/token" }
      tls_config    = { insecure_skip_verify = true }
      forward_to    = [prometheus.remote_write.vm.receiver]
      job_name      = "cadvisor"
    }

    // ================= metrics: annotated app pods (the /metrics contract) =================
    // Pods opt in with prometheus.io/{scrape,port,path} annotations — see Phase 5.
    discovery.kubernetes "pods" { role = "pod" }
    discovery.relabel "pod_metrics" {
      targets = discovery.kubernetes.pods.targets
      rule { action = "keep", regex = "true", source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"] }
      rule { action = "replace", regex = "(.+)", source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"], target_label = "__metrics_path__" }
      rule { action = "replace", regex = "([^:]+)(?::\\d+)?;(\\d+)", separator = ";", source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"], target_label = "__address__" }
      rule { action = "labelmap", regex = "__meta_kubernetes_pod_label_(.+)" }
      rule { action = "replace", source_labels = ["__meta_kubernetes_namespace"], target_label = "namespace" }
      rule { action = "replace", source_labels = ["__meta_kubernetes_pod_name"], target_label = "pod" }
    }
    prometheus.scrape "pod_metrics" {
      targets    = discovery.relabel.pod_metrics.output
      forward_to = [prometheus.remote_write.vm.receiver]
      job_name   = "annotated-pods"
    }

    // ================= OTLP ingest (metrics + logs; TRACES OFF — no Tempo) =================
    otelcol.receiver.otlp "in" {
      grpc { endpoint = "0.0.0.0:4317" }
      http { endpoint = "0.0.0.0:4318" }
      metrics { output = otelcol.exporter.prometheus.m2vm.receiver }
      logs    { output = otelcol.exporter.loki.m2loki.receiver }
      // traces intentionally absent: no Tempo (§1). Enable when/if a trace store exists.
    }
    otelcol.exporter.prometheus "m2vm" {
      add_job_labels = true
      forward_to     = [prometheus.remote_write.vm.receiver]
    }
    otelcol.exporter.loki "m2loki" {
      forward_to = [loki.write.loki.receiver]
    }

    // ================= statsd door (kept closed; enable ~free) =================
    // statsd.exporter "in" {
    //   listen { host = "0.0.0.0", port = 9412 }
    //   forward_to = [prometheus.remote_write.vm.receiver]
    // }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  labels: { app: alloy }
spec:
  selector:
    matchLabels: { app: alloy }
  template:
    metadata:
      labels: { app: alloy }
    spec:
      serviceAccountName: alloy
      # workers only — the 2 GB master must not host an agent (Phase 5)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-pool
                    operator: In
                    values: [data, edge]
      containers:
        - name: alloy
          image: grafana/alloy:v1.4.0
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy
            - --server.http.listen-addr=0.0.0.0:12345
          env:
            - name: HOSTNAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          ports:
            - { containerPort: 12345, name: http }
            - { containerPort: 4317, name: otlp-grpc }
            - { containerPort: 4318, name: otlp-http }
            - { containerPort: 5514, name: syslog, protocol: UDP }
          volumeMounts:
            - { name: config, mountPath: /etc/alloy }
            - { name: podlogs, mountPath: /var/log/pods, readOnly: true }
            - { name: data, mountPath: /var/lib/alloy }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
      volumes:
        - name: config
          configMap: { name: alloy-config }
        - name: podlogs
          hostPath: { path: /var/log/pods }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  labels: { app: alloy }
spec:
  clusterIP: None            # headless; apps target their own node's agent via DNS below
  selector: { app: alloy }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: syslog, port: 5514, protocol: UDP, targetPort: syslog }
---
# Convenience ClusterIP for apps that just want "an" OTLP endpoint (DaemonSet load-balances)
apiVersion: v1
kind: Service
metadata: { name: alloy-otlp }
spec:
  selector: { app: alloy }
  ports: [{ name: otlp-grpc, port: 4317, targetPort: otlp-grpc }]
