# Grafana UI — the "G". Reached at anor.gofar.id (ingress.yaml): the door is
# real now (feat/grafana-door), guarded by Cloudflare Access + generic-OAuth
# OIDC and a Bao-rendered admin password — no more port-forward-only doctrine.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.observability.svc.cluster.local:3100
        isDefault: false
      - name: VictoriaMetrics
        type: prometheus
        access: proxy
        url: http://victoria-metrics.observability.svc.cluster.local:8428
        isDefault: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: { app: grafana }
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  strategy: { type: Recreate }
  template:
    metadata:
      labels: { app: grafana }
      # Observability contract (Phase 5): opt into Alloy's annotated-pods job.
      # Grafana serves Prometheus /metrics on its http port — self-observability
      # for the thing that watches everything else (dashboard-alert latency etc).
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      nodeSelector: { node-pool: edge }
      enableServiceLinks: false   # no legacy docker-style service env injection into app pods
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          ports: [{ containerPort: 3000, name: http }]
          # ZERO config literals (owner ruling 2026-11-11, grafana's share in
          # this PR): the old env block — a secretKeyRef pair on the
          # hand-seeded `grafana-admin` Secret plus the literal
          # GF_ANALYTICS_REPORTING_ENABLED — is MOVED to envFrom, exactly the
          # earendil/mellon pairing: grafana-config (ESO-rendered ConfigMap:
          # constants + Bao-rooted GF_SERVER_ROOT_URL + OIDC enable flags) and
          # grafana-secrets (ESO Secret: admin password + OAuth client
          # id/secret). optional:true on both keeps the bare-k3d rehearsal
          # honest: Grafana boots with its built-in default admin until the
          # store renders, never a CrashLoop on a missing feed.
          envFrom:
            - configMapRef: { name: grafana-config, optional: true }
            - secretRef: { name: grafana-secrets, optional: true }
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: data, mountPath: /var/lib/grafana }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
      volumes:
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: data
          persistentVolumeClaim: { claimName: grafana }
---
apiVersion: v1
kind: Service
metadata: { name: grafana }
spec:
  type: ClusterIP
  selector: { app: grafana }
  ports: [{ name: http, port: 3000, targetPort: http }]
