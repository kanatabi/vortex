# Grafana's config surface — the earendil/mellon app-config pairing copied
# EXACTLY: one ConfigMap ExternalSecret (generic `target.manifest` render —
# constants + Bao-templated values) plus one raw Secret ExternalSecret, both
# fed from the kv mount at grafana/production (kv/data/grafana/production).
# The path is prod-pinned here (not an overlay) because the dashboard door is
# prod-only shape: a staging twin moves these feeds into overlays/<env>/
# observability the day one exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-config
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bao
    kind: ClusterSecretStore
  target:
    name: grafana-config
    manifest:                     # ESO 2.x GENERIC TARGET: create this resource kind
      apiVersion: v1              # instead of a Secret. There is NO spec.target.type
      kind: ConfigMap             # in the 2.15 CRD — see environments/production/earendil.
    template:
      data:
        GF_SERVER_ROOT_URL: "{{ .GF_SERVER_ROOT_URL }}"        # from Bao: https://anor.gofar.id is a VALUE (domain policy, §5)
        GF_AUTH_GENERIC_OAUTH_ENABLED: "true"                  # constant: the OIDC door (Cloudflare Access in front)
        GF_ANALYTICS_REPORTING_ENABLED: "false"                # constant: MOVED here from the Deployment env literal (zero-literals ruling 2026-11-11)
  data:
    - secretKey: GF_SERVER_ROOT_URL
      remoteRef: { key: grafana/production, property: GF_SERVER_ROOT_URL }
---
# The sensitive half: admin password + the OAuth app credentials. Replaces the
# old hand-seeded `grafana-admin` Secret (its own comment promised exactly this
# ESO migration). Key names are 1:1 with Grafana's env contract.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-secrets
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bao
    kind: ClusterSecretStore
  target:
    name: grafana-secrets
  data:
    - secretKey: GF_SECURITY_ADMIN_PASSWORD
      remoteRef: { key: grafana/production, property: GF_SECURITY_ADMIN_PASSWORD }
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
      remoteRef: { key: grafana/production, property: GF_AUTH_GENERIC_OAUTH_CLIENT_ID }
    - secretKey: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
      remoteRef: { key: grafana/production, property: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET }
