# Requires Zalando's Postgres Operator installed first (INFRA_ARCHITECTURE.md, Phase 4):
#   kubectl apply -f https://raw.githubusercontent.com/zalando/postgres-operator/v1.13.0/manifests/operator-manifests.yaml
# This is Topology Option A (2 instances / 2 workers). Option C (3 instances on 3
# workers + synchronous_mode) is a documented one-PR change — INFRA doc Phase 4.
apiVersion: 'acid.zalan.do/v1'
kind: postgresql
metadata:
  name: lumen-pg
  namespace: db
spec:
  teamId: 'lumen'
  volume:
    size: 10Gi
    storageClass: 'local-path'
  numberOfInstances: 2
  node_affinity:                      # keep DB pods off the 2 GB master
    matchExpressions:
      - key: node-pool
        operator: In
        values: ['data', 'edge']
  patroni:
    initdb:
      encoding: 'UTF8'
      data-checksums: 'true'
    ttl: '30'
    loop_wait: '10'
    retry_timeout: '10'
    synchronous_mode: 'false'
  resources:
    requests: { cpu: '250m', memory: '512Mi' }
    limits: { cpu: '1000m', memory: '1Gi' }
  # ONE Patroni cluster (shared instances) serving BOTH environments —
  # separation lives at database + credentials level, selected per env by the
  # DATABASE_URL behind each overlay's Bao path (INFRA doc §5):
  #   kv/lumen/production -> .../lumen-pg-postgres.db.svc/lumen_production
  #   kv/lumen/staging    -> .../lumen-pg-postgres.db.svc/lumen_staging
  # Accepted trade-off: staging load spikes share prod's box (right for blog scale).
  databases:
    lumen_staging: db_user_staging
    lumen_production: db_user_production
  users:
    db_user_staging:
      - createdb
    db_user_production:
      - createdb
