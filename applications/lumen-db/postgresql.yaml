# Requires Zalando's Postgres Operator installed first (INFRA_ARCHITECTURE.md, Phase 4):
#   kubectl apply -f https://raw.githubusercontent.com/zalando/postgres-operator/v1.13.0/manifests/operator-manifests.yaml
# This is Topology Option A (2 instances / 2 workers). Option C (3 instances on 3
# workers + synchronous_mode) is a documented one-PR change — INFRA doc Phase 4.
apiVersion: 'acid.zalan.do/v1'
kind: postgresql
metadata:
  name: lumen-pg
  namespace: db
spec:
  teamId: 'lumen'
  volume:
    size: 10Gi
    storageClass: 'local-path'
  numberOfInstances: 2
  node_affinity:                      # keep DB pods off the 2 GB master
    matchExpressions:
      - key: node-pool
        operator: In
        values: ['data', 'edge']
  postgresql:                  # required block as of operator v2 (the apiserver
    version: '18'              #  rejected its absence, then demanded a version —
    parameters:                #  live walk 2026-11-10, two validations in one pass.
      log_statement: all       # '18' matches the operator's spilo-18 default image.
  patroni:
    initdb:
      encoding: 'UTF8'
      data-checksums: 'true'
    ttl: 30             # typed as of operator v2: ints/bools, NOT quoted strings
    loop_wait: 10       # (the quoted v1-era shapes were REJECTED by the apiserver
    retry_timeout: 10   #  on the first-ever deploy — live walk 2026-11-10)
    synchronous_mode: false
  resources:
    requests: { cpu: '250m', memory: '512Mi' }
    limits: { cpu: '1000m', memory: '1Gi' }
  # ONE Patroni cluster (shared instances, foundation plane) serving ALL
  # environments — THREE logical databases + owner users, per the owner
  # ruling of the environments restructure:
  #   lumen_admin      : db_user_admin       (foundation Control Plane, kv/lumen/shared)
  #   lumen_staging    : db_user_staging     (cms staging,   kv/lumen/staging)
  #   lumen_production : db_user_production  (cms production, kv/lumen/production)
  # Separation lives at database + credentials level, selected per tenant by
  # the LUMEN_DB_URL behind each overlay's Bao path (INFRA doc §5) — no
  # manifest change is needed to add an environment beyond a new db/user
  # pair here + a seed there. The operator generates the per-user credentials
  # into its DOTTED-NAMING Secrets: lumen-pg.<user> (e.g.
  # lumen-pg.db_user_admin) — walk-proven shape, operator v1.13.0 CR fields
  # are `databases:`/`users:` (the walk's apiserver accepted exactly this).
  # Accepted trade-off: staging load spikes share prod's box (right for blog
  # scale).
  databases:
    lumen_admin: db_user_admin
    lumen_staging: db_user_staging
    lumen_production: db_user_production
  users:
    db_user_admin:
      - createdb
    db_user_staging:
      - createdb
    db_user_production:
      - createdb
